apiVersion: 1

groups:
  - orgId: 1
    name: ViajantesTurismo
    folder: ViajantesTurismo
    interval: 1m
    rules:
      - uid: collector-refusing-telemetry
        title: Collector is refusing telemetry
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "sum(increase(otelcol_receiver_refused_spans_total[5m])) + sum(increase(otelcol_receiver_refused_metric_points_total[5m])) + sum(increase(otelcol_receiver_refused_log_records_total[5m]))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Collector is refusing telemetry
          description: The privacy gateway refused telemetry. Because privacy processors fail closed, this means telemetry is being lost rather than leaked.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#collector-refusing-telemetry
        labels:
          severity: critical
      - uid: collector-export-failing
        title: Collector cannot export telemetry
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "sum(increase(otelcol_exporter_send_failed_spans_total[5m])) + sum(increase(otelcol_exporter_send_failed_metric_points_total[5m])) + sum(increase(otelcol_exporter_send_failed_log_records_total[5m]))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Collector cannot export telemetry
          description: A downstream backend (Aspire, Tempo, Loki or the Prometheus exporter) rejected or did not receive telemetry from the gateway.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#collector-export-failing
        labels:
          severity: warning
      - uid: http-5xx-ratio
        title: High 5xx ratio
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count[5m])), 0.1)"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: High 5xx ratio
          description: More than 5 percent of responses were 5xx for 10 minutes.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#http-5xx-ratio
        labels:
          severity: critical
      - uid: unhandled-exceptions
        title: Unhandled exceptions in requests
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "sum(increase(unhandled_exceptions_total[5m]))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Unhandled exceptions in requests
          description: At least one request failed with an exception that no code handled.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#unhandled-exceptions
        labels:
          severity: warning
      - uid: catalog-event-errors
        title: Catalog integration events failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "sum(rate(catalog_integration_event_total{catalog_outcome=\"error\"}[5m])) / clamp_min(sum(rate(catalog_integration_event_total[5m])), 0.01)"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: Catalog integration events failing
          description: More than 10 percent of Catalog integration events ended in error for 10 minutes, so the public catalog may fall behind Admin.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#catalog-event-errors
        labels:
          severity: warning
      - uid: branding-invalidation-failures
        title: Branding cache invalidation failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "sum(increase(branding_cache_invalidations_total{outcome!=\"success\"}[10m]))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Branding cache invalidation failing
          description: Branding cache invalidation reported a non-success outcome, so public pages may serve stale branding.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#branding-invalidation-failures
        labels:
          severity: warning

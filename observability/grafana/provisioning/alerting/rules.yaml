apiVersion: 1

groups:
  - orgId: 1
    name: ViajantesTurismo
    folder: ViajantesTurismo
    interval: 1m
    rules:
      - uid: migration-initialization-failed
        title: Database initialization failed
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "sum(last_over_time(migration_database_initialization_duration_seconds_count{migration_outcome=\"error\"}[5m]))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Database initialization failed
          description: The migration worker reported an error while running migrations or initializing development data.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#migration-initialization-failed
        labels:
          severity: warning
      - uid: collector-refusing-telemetry
        title: Collector is refusing telemetry
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "(sum(increase(otelcol_receiver_refused_spans_total[5m])) or vector(0)) + (sum(increase(otelcol_receiver_refused_metric_points_total[5m])) or vector(0)) + (sum(increase(otelcol_receiver_refused_log_records_total[5m])) or vector(0))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Collector is refusing telemetry
          description: A Collector receiver refused spans, metric points, or log records. Check the processor logs and export routes to establish the cause and affected scope.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#collector-refusing-telemetry
        labels:
          severity: critical
      - uid: collector-export-failing
        title: Collector cannot export telemetry
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "(sum((otelcol_exporter_send_failed_spans_total unless otelcol_exporter_send_failed_spans_total offset 5m) or increase(otelcol_exporter_send_failed_spans_total[5m])) or vector(0)) +
                (sum((otelcol_exporter_send_failed_metric_points_total unless otelcol_exporter_send_failed_metric_points_total offset 5m) or increase(otelcol_exporter_send_failed_metric_points_total[5m])) or vector(0)) +
                (sum((otelcol_exporter_send_failed_log_records_total unless otelcol_exporter_send_failed_log_records_total offset 5m) or increase(otelcol_exporter_send_failed_log_records_total[5m])) or vector(0)) +
                (sum((otelcol_exporter_enqueue_failed_spans_total unless otelcol_exporter_enqueue_failed_spans_total offset 5m) or increase(otelcol_exporter_enqueue_failed_spans_total[5m])) or vector(0)) +
                (sum((otelcol_exporter_enqueue_failed_metric_points_total unless otelcol_exporter_enqueue_failed_metric_points_total offset 5m) or increase(otelcol_exporter_enqueue_failed_metric_points_total[5m])) or vector(0)) +
                (sum((otelcol_exporter_enqueue_failed_log_records_total unless otelcol_exporter_enqueue_failed_log_records_total offset 5m) or increase(otelcol_exporter_enqueue_failed_log_records_total[5m])) or vector(0))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Collector cannot export telemetry
          description: The gateway rejected telemetry at a full exporter queue or could not send telemetry to a backend.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#collector-export-failing
        labels:
          severity: warning
      - uid: collector-self-telemetry-down
        title: Collector self-telemetry is not scraped
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "min(up{job=\"otel-collector-internal\"}) or vector(0)"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: Collector self-telemetry is not scraped
          description: Prometheus cannot scrape the Collector internal metrics, so the refusal and export alerts cannot fire.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#collector-self-telemetry-down
        labels:
          severity: warning
      - uid: http-5xx-ratio
        title: High 5xx ratio
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "(sum((http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"} unless http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"} offset 5m) or increase(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum((http_server_request_duration_seconds_count unless http_server_request_duration_seconds_count offset 5m) or increase(http_server_request_duration_seconds_count[5m])), 1)"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: High 5xx ratio
          description: The five-minute 5xx ratio exceeded 5 percent for 10 minutes.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#http-5xx-ratio
        labels:
          severity: critical
      - uid: unhandled-exceptions
        title: Unhandled exceptions in requests
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "(sum(increase(sharedkernel_aspnetcore_unhandled_exceptions_total[5m])) or vector(0)) + (sum(sharedkernel_aspnetcore_unhandled_exceptions_total unless sharedkernel_aspnetcore_unhandled_exceptions_total offset 5m) or vector(0))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Unhandled exceptions in requests
          description: At least one request failed with an exception that no code handled.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#unhandled-exceptions
        labels:
          severity: warning
      - uid: catalog-event-errors
        title: Catalog integration events failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "(sum((catalog_integration_event_total{catalog_outcome=\"error\"} unless catalog_integration_event_total{catalog_outcome=\"error\"} offset 5m) or increase(catalog_integration_event_total{catalog_outcome=\"error\"}[5m])) or vector(0)) / clamp_min(sum((catalog_integration_event_total unless catalog_integration_event_total offset 5m) or increase(catalog_integration_event_total[5m])), 1)"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: Catalog integration events failing
          description: The five-minute Catalog integration event error ratio exceeded 10 percent for 10 minutes, so the public catalog may fall behind Admin.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#catalog-event-errors
        labels:
          severity: warning
      - uid: branding-invalidation-failures
        title: Branding cache invalidation failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "(sum(increase(branding_cache_invalidations_total{outcome=\"failed\"}[10m])) or vector(0)) + (sum(branding_cache_invalidations_total{outcome=\"failed\"} unless branding_cache_invalidations_total{outcome=\"failed\"} offset 10m) or vector(0))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Branding cache invalidation failing
          description: Branding cache invalidation reported failed, so public pages may serve stale branding.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#branding-invalidation-failures
        labels:
          severity: warning
      - uid: customer-import-failures
        title: Customer imports failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "(sum(increase(admin_customer_import_attempts_total{import_outcome=\"failed\"}[10m])) or vector(0)) + (sum(admin_customer_import_attempts_total{import_outcome=\"failed\"} unless admin_customer_import_attempts_total{import_outcome=\"failed\"} offset 10m) or vector(0))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Customer imports failing
          description: At least one customer import failed in a dependency or the Admin workflow. Input rejections and canceled requests use separate outcomes.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#customer-import-failures
        labels:
          severity: warning
      - uid: customer-import-latency
        title: Customer import processing slow
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "histogram_quantile(0.95, sum by (le) (rate(admin_customer_import_duration_seconds_bucket{import_outcome=\"completed\"}[15m]))) and sum(increase(admin_customer_import_duration_seconds_count{import_outcome=\"completed\"}[15m])) >= 3"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [30]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Customer import processing slow
          description: The 95th percentile of completed customer import processing exceeded 30 seconds with at least three attempts in the last 15 minutes.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#customer-import-latency
        labels:
          severity: warning
      - uid: catalog-media-upload-failures
        title: Catalog media upload dependencies failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "sum by (upload_outcome) ((increase(catalog_media_upload_attempts_total{upload_outcome=~\"scanner_unavailable|storage_failed\"}[10m]) > 0) or (catalog_media_upload_attempts_total{upload_outcome=~\"scanner_unavailable|storage_failed\"} unless catalog_media_upload_attempts_total{upload_outcome=~\"scanner_unavailable|storage_failed\"} offset 10m))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Catalog media upload dependencies failing
          description: The media scanner was unavailable or an original object write failed. Inspect the reported outcome to choose the dependency to check.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#catalog-media-upload-failures
        labels:
          severity: warning
      - uid: catalog-media-upload-latency
        title: Catalog media upload stage slow
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "histogram_quantile(0.95, sum by (le, upload_stage) (rate(catalog_media_upload_stage_duration_seconds_bucket[15m]))) and sum by (upload_stage) (increase(catalog_media_upload_stage_duration_seconds_count[15m])) >= 3"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Catalog media upload stage slow
          description: The 95th percentile for media scan or store exceeded 10 seconds, with at least three observations of that stage in 15 minutes.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#catalog-media-upload-latency
        labels:
          severity: warning
      - uid: management-session-ticket-failures
        title: Management Web session ticket operations failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "sum by (sharedkernel_bff_session_ticket_operation) ((increase(sharedkernel_bff_session_ticket_failures_total[10m]) > 0) or (sharedkernel_bff_session_ticket_failures_total unless sharedkernel_bff_session_ticket_failures_total offset 10m))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Management Web session ticket operations failing
          description: A session ticket protection, unprotection, or cache operation failed. Follow the runbook for the reported operation.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#management-session-ticket-failures
        labels:
          severity: warning
      - uid: document-operation-failures
        title: Document operation failures
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "(sum(increase(admin_document_operation_total{document_outcome=\"failed\"}[10m])) or vector(0)) + (sum(admin_document_operation_total{document_outcome=\"failed\"} unless admin_document_operation_total{document_outcome=\"failed\"} offset 10m) or vector(0))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Admin document operation failed
          description: An Admin document request or a scheduled retention batch reported an operational failure.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#document-operation-failures
        labels:
          severity: warning
  - orgId: 1
    name: Polling liveness
    folder: ViajantesTurismo
    interval: 1m
    rules:
      - uid: polling-batch-stalled
        title: Polling batch age exceeds the investigation threshold
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "max by (sharedkernel_scheduling_service_name) (((sharedkernel_scheduling_polling_batch_active_duration_seconds{sharedkernel_scheduling_service_name=\"catalog-projections\"} > 120) or (sharedkernel_scheduling_polling_batch_active_duration_seconds{sharedkernel_scheduling_service_name=~\"catalog-media-object-reconciliation|branding-logo-reclamation|admin-document-(draft|audit|idempotency)-retention\"} > 900)) and (delta(sharedkernel_scheduling_polling_batch_active_duration_seconds[3m]) > 0))"
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 4m
        annotations:
          summary: Polling batch age exceeds the investigation threshold
          description: For four consecutive minutes, an advancing batch exceeded two minutes for Catalog projections or fifteen minutes for media reconciliation, Branding reclamation, or Admin retention.
          runbook: docs/OBSERVABILITY_RUNBOOKS.md#polling-batch-stalled
        labels:
          severity: warning

apiVersion: 1

contactPoints:
  - orgId: 1
    name: local-development
    receivers:
      - uid: local-development-webhook
        type: webhook
        settings:
          url: http://127.0.0.1:9/local-alert-sink
          httpMethod: POST
          message: '{{ range .Alerts }}{{ template "viajantes.message" . }}{{ end }}'
        disableResolveMessage: false

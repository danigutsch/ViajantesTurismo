rule_files:
  - collector-export-alert.rules.yml
evaluation_interval: 1m

tests:
  # Each queue can reject before any send failure or other signal produces a series.

  - interval: 1m
    input_series:
      - series: 'otelcol_exporter_enqueue_failed_spans_total{exporter="fixture"}'
        values: '_ 1+0x8'
    promql_expr_test:
      - expr: test:collector_export_failures
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="test:collector_export_failures"}'
            value: 1
    alert_rule_test:
      - alertname: CollectorExportFailing
        eval_time: 1m
        exp_alerts: []
      - alertname: CollectorExportFailing
        eval_time: 2m
        exp_alerts: [{}]
      - alertname: CollectorExportFailing
        eval_time: 6m
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'otelcol_exporter_enqueue_failed_metric_points_total{exporter="fixture"}'
        values: '_ 1+0x8'
    promql_expr_test:
      - expr: test:collector_export_failures
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="test:collector_export_failures"}'
            value: 1
    alert_rule_test:
      - alertname: CollectorExportFailing
        eval_time: 1m
        exp_alerts: []
      - alertname: CollectorExportFailing
        eval_time: 2m
        exp_alerts: [{}]
      - alertname: CollectorExportFailing
        eval_time: 6m
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'otelcol_exporter_enqueue_failed_log_records_total{exporter="fixture"}'
        values: '_ 1+0x8'
    promql_expr_test:
      - expr: test:collector_export_failures
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="test:collector_export_failures"}'
            value: 1
    alert_rule_test:
      - alertname: CollectorExportFailing
        eval_time: 1m
        exp_alerts: []
      - alertname: CollectorExportFailing
        eval_time: 2m
        exp_alerts: [{}]
      - alertname: CollectorExportFailing
        eval_time: 6m
        exp_alerts: []

  # The established send-failure counters retain their existing behavior.
  - interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_spans_total{exporter="fixture"}'
        values: '0+0x5 1+0x8'
      - series: 'otelcol_exporter_send_failed_metric_points_total{exporter="fixture"}'
        values: '0+0x14'
      - series: 'otelcol_exporter_send_failed_log_records_total{exporter="fixture"}'
        values: '0+0x14'
    alert_rule_test:
      - alertname: CollectorExportFailing
        eval_time: 7m
        exp_alerts: [{}]
      - alertname: CollectorExportFailing
        eval_time: 11m
        exp_alerts: []

  # Send and enqueue failures can share labels. The new queue value already includes its second rejection.
  - interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_spans_total{exporter="fixture"}'
        values: '0+0x5 1+0x8'
      - series: 'otelcol_exporter_enqueue_failed_spans_total{exporter="fixture"}'
        values: '_ _ _ _ _ _ 1 2+0x7'
    promql_expr_test:
      - expr: test:collector_export_failures
        eval_time: 7m
        exp_samples:
          - labels: '{__name__="test:collector_export_failures"}'
            value: 3

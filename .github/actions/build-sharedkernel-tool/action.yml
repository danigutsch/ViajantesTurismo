name: Build SharedKernel tool
description: >-
  Build a source-runnable SharedKernel tool at the pinned library revision and export
  SHAREDKERNEL_SOURCE. Sets up the .NET SDK pinned by global.json and builds in locked-restore mode
  through the shared setup-dotnet-tool action.

inputs:
  tool:
    description: SharedKernel.CI.Tool or SharedKernel.RepoConfig.Tool.
    required: true
  library-root:
    description: Optional clean checkout of the pinned SharedKernel revision used instead of a sparse checkout.
    required: false
    default: ""
  revision:
    description: Optional full SharedKernel commit SHA to build instead of the pinned libraryRevision.
    required: false
    default: ""
  sparse-extra:
    description: Optional extra directory added to the sparse checkout, such as .github for the action pin manifest.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve pinned SharedKernel source
      id: sharedkernel-source
      shell: pwsh
      env:
        TOOL: ${{ inputs.tool }}
        LIBRARY_ROOT: ${{ inputs.library-root }}
        REVISION_OVERRIDE: ${{ inputs.revision }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:TOOL -cne 'SharedKernel.CI.Tool' -and $env:TOOL -cne 'SharedKernel.RepoConfig.Tool') {
          throw "Unsupported SharedKernel tool: $env:TOOL"
        }
        $pin = Get-Content -LiteralPath .config/sharedkernel-candidate.json -Raw | ConvertFrom-Json
        $revision = [string]$pin.libraryRevision
        if ($env:REVISION_OVERRIDE -ne '') {
          $revision = $env:REVISION_OVERRIDE
        }
        if ($revision -cnotmatch '^[0-9a-f]{40}$') {
          throw 'The SharedKernel revision (libraryRevision or the revision input) must be 40 lowercase hexadecimal characters.'
        }
        if ($env:LIBRARY_ROOT -eq '') {
          $source = Join-Path $env:WORKSPACE ".local/sharedkernel-source/$env:TOOL"
        }
        else {
          $source = [System.IO.Path]::GetFullPath($env:LIBRARY_ROOT)
          $cdup = git -C $source rev-parse --show-cdup
          if ($LASTEXITCODE -ne 0 -or $cdup -ne '') {
            throw 'The SharedKernel library root must be the top level of a Git work tree.'
          }
          $head = git -C $source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $revision) {
            throw 'The SharedKernel library root must be checked out at the selected revision.'
          }
          $status = git -C $source status --porcelain
          if ($LASTEXITCODE -ne 0 -or $status) {
            throw 'The SharedKernel library root must have a clean git status.'
          }
        }
        "revision=$revision" >> $env:GITHUB_OUTPUT
        "source=$source" >> $env:GITHUB_OUTPUT
        "SHAREDKERNEL_SOURCE=$source" >> $env:GITHUB_ENV

    - name: Checkout pinned SharedKernel tool source
      if: ${{ inputs.library-root == '' }}
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: danigutsch/PandaBear.SharedKernel
        ref: ${{ steps.sharedkernel-source.outputs.revision }}
        path: .local/sharedkernel-source/${{ inputs.tool }}
        persist-credentials: false
        sparse-checkout-cone-mode: true
        sparse-checkout: |
          tools/${{ inputs.tool }}
          tools/Shared
          ${{ inputs.sparse-extra }}

    - name: Set up the SDK and build SharedKernel tool
      uses: danigutsch/PandaBear.SharedKernel/.github/actions/setup-dotnet-tool@96f094ff0c4e678bf72abb9041e6dd3b83602cac
      with:
        project: tools/${{ inputs.tool }}
        global-json-file: global.json
        working-directory: ${{ steps.sharedkernel-source.outputs.source }}
        cache-dependency-path: |
          **/packages.lock.json
          !.local/**

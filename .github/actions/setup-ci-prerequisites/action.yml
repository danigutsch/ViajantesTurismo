name: Setup CI Prerequisites
description: Set up the repository toolchains and restore shared prerequisites for CI jobs.

inputs:
  restore-targets:
    description: Newline-delimited solution or project paths to restore.
    required: false
    default: ViajantesTurismo.slnx
  restore-targets-file:
    description: Path to a newline-delimited file of solution or project paths to restore.
    required: false
    default: ""
  restore-local-tools:
    description: Whether to restore repository-local .NET tools.
    required: false
    default: "true"
  dotnet-global-json:
    description: Path to the global.json file used to select the .NET SDK.
    required: false
    default: global.json
  trust-dev-certificate:
    description: Whether to trust the ASP.NET HTTPS developer certificate.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure NuGet global-packages path
      shell: bash
      run: echo "NUGET_PACKAGES=$GITHUB_WORKSPACE/.nuget/packages" >> "$GITHUB_ENV"

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
      with:
        global-json-file: ${{ inputs.dotnet-global-json }}
        cache: true
        cache-dependency-path: |
          **/packages.lock.json

    - name: Restore .NET dependencies
      shell: bash
      env:
        RESTORE_TARGETS: ${{ inputs.restore-targets }}
        RESTORE_TARGETS_FILE: ${{ inputs.restore-targets-file }}
      run: |
        restore_targets=()

        if [[ -n "${RESTORE_TARGETS_FILE}" ]]; then
          while IFS= read -r restore_target; do
            [[ -z "$restore_target" ]] && continue
            restore_targets+=("$restore_target")
          done < "${RESTORE_TARGETS_FILE}"
        else
          while IFS= read -r restore_target; do
            [[ -z "$restore_target" ]] && continue
            restore_targets+=("$restore_target")
          done <<< "${RESTORE_TARGETS}"
        fi

        if [[ ${#restore_targets[@]} -eq 0 ]]; then
          if [[ -n "${RESTORE_TARGETS_FILE}" ]]; then
            echo "Restore target file '${RESTORE_TARGETS_FILE}' is empty." >&2
          else
            echo "At least one restore target is required." >&2
          fi

          exit 1
        fi

        if [[ ${#restore_targets[@]} -eq 1 ]]; then
          dotnet restore "${restore_targets[0]}" --locked-mode
          exit 0
        fi

        restore_as_project_graph=true
        for restore_target in "${restore_targets[@]}"; do
          case "${restore_target}" in
            *.csproj | *.fsproj | *.vbproj) ;;
            *) restore_as_project_graph=false ;;
          esac
        done

        if [[ "${restore_as_project_graph}" != "true" ]]; then
          for restore_target in "${restore_targets[@]}"; do
            dotnet restore "${restore_target}" --locked-mode
          done
          exit 0
        fi

        mkdir -p TestResults
        restore_workspace="$(mktemp -d "TestResults/ci-restore.XXXXXX")"
        trap 'rm -r -- "${restore_workspace}"' EXIT
        dotnet new sln --name ci-restore --output "${restore_workspace}"

        if [[ -f "${restore_workspace}/ci-restore.slnx" ]]; then
          restore_solution="${restore_workspace}/ci-restore.slnx"
        elif [[ -f "${restore_workspace}/ci-restore.sln" ]]; then
          restore_solution="${restore_workspace}/ci-restore.sln"
        else
          echo "Temporary restore solution was not created." >&2
          exit 1
        fi

        echo "Restoring ${#restore_targets[@]} targets as one MSBuild graph."
        dotnet sln "${restore_solution}" add "${restore_targets[@]}"
        dotnet restore "${restore_solution}" --locked-mode

    - name: Restore .NET local tools
      if: ${{ inputs.restore-local-tools == 'true' }}
      shell: bash
      run: dotnet tool restore

    - name: Trust HTTPS developer certificate
      if: ${{ inputs.trust-dev-certificate == 'true' }}
      shell: bash
      run: |
        dotnet dev-certs https --trust || true
        echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust" >> "$GITHUB_ENV"

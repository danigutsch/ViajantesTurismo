name: Setup CI Prerequisites
description: Stage the pinned SharedKernel candidate and restore local tools for CI jobs.

inputs:
  sharedkernel-library-root:
    description: Optional clean checkout of the pinned SharedKernel revision.
    required: false
    default: ""
  sharedkernel-candidate-feed:
    description: Optional directory containing unchanged pinned candidate packages.
    required: false
    default: ""
  restore-local-tools:
    description: Whether to restore repository-local .NET tools.
    required: false
    default: "true"
  trust-dev-certificate:
    description: Whether to trust the ASP.NET HTTPS developer certificate.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure NuGet global-packages path
      shell: bash
      run: echo "NUGET_PACKAGES=$GITHUB_WORKSPACE/.nuget/packages" >> "$GITHUB_ENV"

    - name: Build SharedKernel CI tool
      uses: ./.github/actions/build-sharedkernel-tool
      with:
        tool: SharedKernel.CI.Tool
        library-root: ${{ inputs.sharedkernel-library-root }}

    - name: Stage pinned SharedKernel candidate
      shell: pwsh
      env:
        LIBRARY_ROOT: ${{ inputs.sharedkernel-library-root }}
        CANDIDATE_FEED: ${{ inputs.sharedkernel-candidate-feed }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:CANDIDATE_FEED -ne '') {
          $source = '--feed', $env:CANDIDATE_FEED
        }
        elseif ($env:LIBRARY_ROOT -ne '') {
          $pin = Get-Content -LiteralPath .config/sharedkernel-candidate.json -Raw | ConvertFrom-Json
          $source = '--feed', (Join-Path $env:LIBRARY_ROOT "artifacts/api-compat/packages/$($pin.packageVersion)")
        }
        else {
          $source = '--repository', 'danigutsch/PandaBear.SharedKernel'
        }
        dotnet run --project (Join-Path $env:SHAREDKERNEL_SOURCE 'tools/SharedKernel.CI.Tool') -c Release --no-build -- `
          stage-candidate --pin .config/sharedkernel-candidate.json --library-root $env:SHAREDKERNEL_SOURCE `
          --output .local/sharedkernel-feed @source
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Restore .NET local tools
      if: ${{ inputs.restore-local-tools == 'true' }}
      shell: bash
      run: dotnet tool restore

    - name: Trust HTTPS developer certificate
      if: ${{ inputs.trust-dev-certificate == 'true' }}
      shell: bash
      run: |
        dotnet dev-certs https --trust || true
        echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust" >> "$GITHUB_ENV"

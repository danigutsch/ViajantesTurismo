name: Setup CI Prerequisites
description: Set up the repository toolchains and restore shared prerequisites for CI jobs.

inputs:
  sharedkernel-library-root:
    description: Optional clean checkout of the pinned SharedKernel revision.
    required: false
    default: ""
  sharedkernel-candidate-feed:
    description: Optional directory containing unchanged pinned candidate packages.
    required: false
    default: ""
  restore-targets:
    description: Newline-delimited solution or project paths to restore.
    required: false
    default: ViajantesTurismo.slnx
  restore-targets-file:
    description: Path to a newline-delimited file of solution or project paths to restore.
    required: false
    default: ""
  restore-local-tools:
    description: Whether to restore repository-local .NET tools.
    required: false
    default: "true"
  dotnet-global-json:
    description: Path to the global.json file used to select the .NET SDK.
    required: false
    default: global.json
  trust-dev-certificate:
    description: Whether to trust the ASP.NET HTTPS developer certificate.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure NuGet global-packages path
      shell: bash
      run: echo "NUGET_PACKAGES=$GITHUB_WORKSPACE/.nuget/packages" >> "$GITHUB_ENV"

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
      with:
        global-json-file: ${{ inputs.dotnet-global-json }}
        cache: true
        cache-dependency-path: |
          **/packages.lock.json

    - name: Read pinned SharedKernel identity
      id: sharedkernel-pin
      shell: pwsh
      run: |
        $pin = Get-Content -LiteralPath .config/sharedkernel-candidate.json -Raw | ConvertFrom-Json
        if ($pin.libraryRevision -cnotmatch '^[a-f0-9]{40}$' -or
            $pin.packageVersion -cnotmatch '^[0-9A-Za-z.+-]+$') {
          throw "The committed SharedKernel revision or package version is invalid."
        }
        "revision=$($pin.libraryRevision)" >> $env:GITHUB_OUTPUT
        "version=$($pin.packageVersion)" >> $env:GITHUB_OUTPUT

    - name: Checkout pinned SharedKernel source
      if: ${{ inputs.sharedkernel-library-root == '' }}
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        repository: danigutsch/PandaBear.SharedKernel
        ref: ${{ steps.sharedkernel-pin.outputs.revision }}
        path: .local/sharedkernel-library
        persist-credentials: false
        sparse-checkout: |
          src
          tools

    - name: Download pinned SharedKernel candidate
      if: ${{ inputs.sharedkernel-library-root == '' && inputs.sharedkernel-candidate-feed == '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PINNED_VERSION: ${{ steps.sharedkernel-pin.outputs.version }}
      run: |
        gh release download "v${PINNED_VERSION}" --repo danigutsch/PandaBear.SharedKernel \
          --pattern '*.nupkg' --pattern 'candidate.json' \
          --dir "${GITHUB_WORKSPACE}/.local/sharedkernel-download"

    - name: Stage pinned SharedKernel candidate
      shell: bash
      env:
        LIBRARY_ROOT: ${{ inputs.sharedkernel-library-root }}
        CANDIDATE_FEED: ${{ inputs.sharedkernel-candidate-feed }}
      run: |
        if [[ -z "${LIBRARY_ROOT}" ]]; then
          LIBRARY_ROOT="${GITHUB_WORKSPACE}/.local/sharedkernel-library"
          CANDIDATE_FEED="${CANDIDATE_FEED:-${GITHUB_WORKSPACE}/.local/sharedkernel-download}"
        fi
        args=(bootstrap-sharedkernel --library-root "${LIBRARY_ROOT}")
        if [[ -n "${CANDIDATE_FEED}" ]]; then args+=(--feed "${CANDIDATE_FEED}"); fi
        dotnet run --project tools/ViajantesTurismo.RepoConfig.Tool -c Release -- "${args[@]}"

    - name: Restore .NET dependencies
      shell: bash
      env:
        RESTORE_TARGETS: ${{ inputs.restore-targets }}
        RESTORE_TARGETS_FILE: ${{ inputs.restore-targets-file }}
      run: dotnet run --project tools/ViajantesTurismo.RepoConfig.Tool -c Release --no-build --no-restore -- restore-ci-projects --projects-file "$RESTORE_TARGETS_FILE" --targets "$RESTORE_TARGETS"

    - name: Restore .NET local tools
      if: ${{ inputs.restore-local-tools == 'true' }}
      shell: bash
      run: dotnet tool restore

    - name: Trust HTTPS developer certificate
      if: ${{ inputs.trust-dev-certificate == 'true' }}
      shell: bash
      run: |
        dotnet dev-certs https --trust || true
        echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust" >> "$GITHUB_ENV"

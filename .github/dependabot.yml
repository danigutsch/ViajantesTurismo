version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    ignore:
      # SharedKernel refs move with the SharedKernel pin bump: libraryRevision for the candidate and scanner action,
      # one shared-workflow SHA for the reusable workflows and setup-dotnet-tool.
      - dependency-name: danigutsch/PandaBear.SharedKernel
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # Third-party pins follow SharedKernel's .github/action-pins.json and
      # verify-action-pins fails on drift, so bumps start from the manifest, not from Dependabot.
      - dependency-name: actions/checkout
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: actions/setup-dotnet
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: actions/upload-artifact
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: actions/download-artifact
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: github/codeql-action
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: actions/dependency-review-action
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: actions/create-github-app-token
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: DavidAnson/markdownlint-cli2-action
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: tj-actions/changed-files
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: "UTC"
    ignore:
      # global.json must match the pinned SharedKernel global.json; the SDK moves with SharedKernel pin bumps.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - .net

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    cooldown:
      semver-major-days: 90
      semver-minor-days: 30
      semver-patch-days: 14
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - .net

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: quarterly
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    groups:
      devcontainers:
        patterns:
          - "*"
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - ci

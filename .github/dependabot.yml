version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    ignore:
      # SharedKernel action refs must equal libraryRevision in .config/sharedkernel-candidate.json; pin bumps move them.
      - dependency-name: danigutsch/PandaBear.SharedKernel
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: "UTC"
    ignore:
      # global.json must match the pinned SharedKernel global.json; the SDK moves with SharedKernel pin bumps.
      - dependency-name: "*"
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - .net

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    cooldown:
      semver-major-days: 90
      semver-minor-days: 30
      semver-patch-days: 14
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - .net

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: quarterly
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    groups:
      devcontainers:
        patterns:
          - "*"
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - ci

name: Actionlint

'on':
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: danigutsch/PandaBear.SharedKernel/.github/workflows/actionlint-reusable.yml@945d78101108f3e8f4841753fc4a6adcc9916424
    with:
      runner: ${{ vars.CI_UBUNTU_RUNNER }}

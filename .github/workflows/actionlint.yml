name: Actionlint

'on':
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: danigutsch/PandaBear.SharedKernel/.github/workflows/actionlint-reusable.yml@dca2de14985fc5a18eb9a632ee17705deb50cbe9
    with:
      runner: ${{ vars.CI_UBUNTU_RUNNER }}

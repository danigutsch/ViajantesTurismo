name: Actionlint

'on':
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: danigutsch/PandaBear.SharedKernel/.github/workflows/actionlint-reusable.yml@2c9a17f0cdb035bd9d1690547e3877cfe9b71b61
    with:
      runner: ${{ vars.CI_UBUNTU_RUNNER }}

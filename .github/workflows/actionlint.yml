name: Actionlint

'on':
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: danigutsch/PandaBear.SharedKernel/.github/workflows/actionlint-reusable.yml@2fa85f6ddc03e0ad854c5b34f5c3628f1ef67e54
    with:
      runner: ${{ vars.CI_UBUNTU_RUNNER }}

name: Actionlint

'on':
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    permissions:
      contents: read
    uses: danigutsch/PandaBear.SharedKernel/.github/workflows/actionlint-reusable.yml@079cd9fb28192d027fb14d959da9e29f7ab6d2a4
    with:
      runner: ${{ vars.CI_UBUNTU_RUNNER }}

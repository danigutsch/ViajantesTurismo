name: Sync Repository Labels

on:
  push:
    branches:
      - main
    paths:
      - .config/sharedkernel-repo.json
      - .github/workflows/sync-labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    name: Sync Labels
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up repository tool SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Build pinned SharedKernel repository tool
        uses: ./.github/actions/build-sharedkernel-tool
        with:
          tool: SharedKernel.RepoConfig.Tool

      - name: Create or update repository labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet run --project "$SHAREDKERNEL_SOURCE/tools/SharedKernel.RepoConfig.Tool" -c Release --no-build -- \
            github sync-labels --repository "$GITHUB_REPOSITORY" --force --root .

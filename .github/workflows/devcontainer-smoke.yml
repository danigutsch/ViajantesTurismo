name: Devcontainer Smoke

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer-smoke.yml
      - global.json
      - setup-dev.sh
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Validation level to run inside the devcontainer
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'schedule' && github.event.schedule || github.event_name == 'workflow_dispatch' && inputs.validation_mode || 'default' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  devcontainer-smoke:
    name: Devcontainer Smoke
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 90
    env:
      VERIFY_TOOLCHAINS: dotnet --version && git --version && docker version --format "{{.Server.Version}}"
      # Playwright 1.60 still uses Ubuntu 24.04 dependency manifests (microsoft/playwright#40117), so the
      # devcontainer installs Chromium's Ubuntu 26.04 libraries itself and Playwright skips --with-deps.
      INSTALL_PLAYWRIGHT_DEPENDENCIES: |
        set -euo pipefail
        apt=(apt-get)
        [[ "$(id -u)" == 0 ]] || apt=(sudo apt-get)
        "${apt[@]}" update
        "${apt[@]}" install -y --no-install-recommends \
          libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 \
          libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 \
          libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
      RUN_TEST_SLICES: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) export PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64 ;;
          aarch64) export PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-arm64 ;;
        esac
        selection=TestResults/devcontainer-selection
        dotnet tool run sharedkernel-ci -- select --selection "${selection}"
        for slice in $(pwsh -NoProfile -Command "(Get-Content .config/sharedkernel-ci.json -Raw | ConvertFrom-Json).slices.name"); do
          echo "==> Running ${slice}"
          dotnet tool run sharedkernel-ci -- run --slice "${slice}" --selection "${selection}" --install-playwright \
            --exclude-trait Requires=fasttext
        done
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Stage pinned SharedKernel candidate on host
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          sharedkernel-library-root: ${{ vars.SHAREDKERNEL_LIBRARY_ROOT }}
          sharedkernel-candidate-feed: ${{ vars.SHAREDKERNEL_CANDIDATE_FEED }}
          trust-dev-certificate: "false"

      - name: Select devcontainer validation mode
        id: validation-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          DISPATCH_MODE: ${{ inputs.validation_mode || 'smoke' }}
        run: |
          set -euo pipefail

          mode="smoke"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            mode="${DISPATCH_MODE}"
          elif [[ "${EVENT_NAME}" == "schedule" && "${EVENT_SCHEDULE}" == '0 6 1 * *' ]]; then
            mode="full"
          fi

          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

      - name: Validate the devcontainer toolchains
        if: steps.validation-mode.outputs.mode == 'smoke'
        run: dotnet tool run sharedkernel-repo -- verify-devcontainer --exec "$VERIFY_TOOLCHAINS" --root .

      - name: Validate the devcontainer with every test slice
        if: steps.validation-mode.outputs.mode == 'full'
        run: |
          dotnet tool run sharedkernel-repo -- verify-devcontainer --exec "$VERIFY_TOOLCHAINS" \
            --exec "$INSTALL_PLAYWRIGHT_DEPENDENCIES" --exec "$RUN_TEST_SLICES" --root .

      - name: Upload devcontainer smoke logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() }}
        with:
          if-no-files-found: error
          name: devcontainer-smoke-logs
          path: TestResults/devcontainer-smoke/**
          retention-days: 7

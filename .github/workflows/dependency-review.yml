name: Dependency Review

'on':
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - labeled
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && github.run_id || 'validation' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan Dependency Review
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:rerun' }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      review_required: ${{ steps.plan.outputs.documentation_only == 'true' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned SharedKernel CI tool
        uses: ./.github/actions/build-sharedkernel-tool
        with:
          tool: SharedKernel.CI.Tool
      # Only a change that selects nothing because it touches documentation alone skips the review.
      - name: Plan exact dependency comparison
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) BASE_SHA="$(git rev-parse HEAD^1)" ;;
            push) BASE_SHA="$PUSH_BEFORE" ;;
            merge_group) BASE_SHA="$MERGE_GROUP_BASE" ;;
            *) BASE_SHA="" ;;
          esac
          dotnet run --project "$SHAREDKERNEL_SOURCE/tools/SharedKernel.CI.Tool" -c Release --no-build -- \
            select --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Retain selection evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-review-selection
          path: TestResults/selection/**
          if-no-files-found: error

  dependency-snapshots:
    needs: plan
    name: Dependency snapshot (${{ matrix.target }})
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (needs.plan.outputs.review_required == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'))
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'pull_request' && fromJSON('["base", "head"]') || fromJSON('["head"]') }}
    uses: danigutsch/PandaBear.SharedKernel/.github/workflows/dependency-snapshot-reusable.yml@c82b4469c099604587ed8314709ad30686f18b0c
    with:
      runner: ${{ vars.CI_UBUNTU_RUNNER }}
      target: ${{ matrix.target }}
      correlator: viajantes-solution-nuget
      source-repository: danigutsch/PandaBear.SharedKernel
      source-ref: c82b4469c099604587ed8314709ad30686f18b0c

  dependency-review:
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && 'Ignored label event' || 'Dependency Review' }}
    needs: [plan, dependency-snapshots]
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') && (always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')) }}
    permissions:
      contents: read
    uses: danigutsch/PandaBear.SharedKernel/.github/workflows/dependency-review-reusable.yml@c82b4469c099604587ed8314709ad30686f18b0c
    with:
      runner: ${{ vars.CI_UBUNTU_RUNNER }}
      review-required: ${{ needs.plan.outputs.review_required }}
      plan-result: ${{ needs.plan.result }}
      snapshot-result: ${{ needs.dependency-snapshots.result }}
      fail-on-severity: moderate
      verify-license-exceptions: true
      source-repository: danigutsch/PandaBear.SharedKernel
      source-ref: c82b4469c099604587ed8314709ad30686f18b0c
      allow-licenses: >-
        MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, ISC, PostgreSQL, Zlib,
        Unlicense, CC0-1.0

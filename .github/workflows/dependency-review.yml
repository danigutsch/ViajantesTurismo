name: Dependency Review

'on':
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-snapshots:
    name: Dependency snapshot (${{ matrix.target }})
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'pull_request' && fromJSON('["base", "head"]') || fromJSON('["head"]') }}
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.target == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up CI prerequisites
        if: ${{ hashFiles('.config/sharedkernel-candidate.json') != '' }}
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          sharedkernel-library-root: ${{ vars.SHAREDKERNEL_LIBRARY_ROOT }}
          sharedkernel-candidate-feed: ${{ vars.SHAREDKERNEL_CANDIDATE_FEED }}
          restore-targets: tools/ViajantesTurismo.RepoConfig.Tool/ViajantesTurismo.RepoConfig.Tool.csproj
          restore-local-tools: "false"
          trust-dev-certificate: "false"

      - name: Set up SDK for commits before the package cutover
        if: ${{ hashFiles('.config/sharedkernel-candidate.json') == '' }}
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Restore complete locked dependency graph
        run: dotnet restore ViajantesTurismo.slnx --locked-mode -bl:dependency-restore.binlog

      - name: Submit complete dependency snapshot
        uses: actions/component-detection-dependency-submission-action@98beaea5a1227f3db476e4c9ca959a0cacd7ac4f # reviewed automatic-submission revision
        with:
          detectorsCategories: NuGet
          correlator: viajantes-solution-nuget
          snapshot-sha: ${{ matrix.target == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha || github.sha }}
          snapshot-ref: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', matrix.target == 'base' && github.base_ref || github.head_ref) || github.ref }}

  dependency-review:
    name: Dependency Review
    needs: dependency-snapshots
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    steps:
      - name: Require successful snapshot generation when applicable
        env:
          SNAPSHOT_RESULT: ${{ needs.dependency-snapshots.result }}
        run: |
          case "$SNAPSHOT_RESULT" in
            success | skipped) ;;
            *) echo "Dependency snapshot generation did not succeed." >&2; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The pinned Action ignores purl versions. Fail before emitting its exception if approval expires.
      # Maintainer approved this preview graph on 2026-10-21; evidence: docs/ci/dependency-license-evidence.md.
      - name: Validate exact preview license approval
        id: preview-license
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content '.config/sharedkernel-candidate.json' -Raw | ConvertFrom-Json
          if ($pin.packageVersion -cne '1.0.0-alpha.20261021.2' -or
              $pin.libraryRevision -cne 'f5975b60601e245bda6bb8e45559d8ce3a24a8e0' -or
              $pin.libraryDirty -ne $false) {
            throw 'Preview license approval expired: re-review this candidate before granting an exception.'
          }
          $locks = @(git ls-files -- '**/packages.lock.json')
          if ($LASTEXITCODE -ne 0 -or $locks.Count -eq 0) { throw 'Cannot inspect the tracked dependency graph.' }
          $approved = @{ 'StreamJsonRpc' = '2.25.29'; 'Magick.NET-Q8-AnyCPU' = '15.0.0' }
          $found = @{}
          foreach ($path in $locks) {
            $lock = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -AsHashtable
            foreach ($target in $lock.dependencies.Values) {
              foreach ($entry in $target.GetEnumerator()) {
                if ($approved.ContainsKey($entry.Key)) {
                  if ($entry.Value.resolved -cne $approved[$entry.Key]) {
                    throw "License approval for $($entry.Key) covers only $($approved[$entry.Key]); found '$($entry.Value.resolved)' in $path."
                  }
                  $found[$entry.Key] = $true
                }
              }
            }
          }
          if ($found.Count -ne $approved.Count) { throw 'An approved package no longer exists in the locked graph; remove its preview exception.' }
          'packages=pkg:nuget/StreamJsonRpc@2.25.29,pkg:nuget/Magick.NET-Q8-AnyCPU@15.0.0' >> $env:GITHUB_OUTPUT

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          license-check: true
          vulnerability-check: true
          # Informational scorecards perform serial external lookups for repeated manifest entries.
          show-openssf-scorecard: false
          allow-dependencies-licenses: ${{ steps.preview-license.outputs.packages }}
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, ISC, PostgreSQL, Zlib,
            Unlicense, CC0-1.0

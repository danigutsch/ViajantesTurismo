name: Dependency Review

'on':
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - labeled
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && github.run_id || 'validation' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan Dependency Review
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:rerun' }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      review_required: ${{ steps.plan.outputs.review_required }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json
      - name: Plan exact dependency comparison
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: dotnet run --project tools/ViajantesTurismo.RepoConfig.Tool -c Release -- plan-dependency-review --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Retain selection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-review-plan
          path: TestResults/dependency-review-plan.json
          if-no-files-found: error

  dependency-snapshots:
    needs: plan
    name: Dependency snapshot (${{ matrix.target }})
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (needs.plan.outputs.review_required == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'))
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      # Reviewed source generator: https://github.com/danigutsch/PandaBear.SharedKernel/pull/92
      # Pin independently of runtime packages so both targets can read retired candidates' lock metadata.
      SNAPSHOT_GENERATOR_REVISION: 8895a57934be23177f9979a23620774e5085eb3d
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'pull_request' && fromJSON('["base", "head"]') || fromJSON('["head"]') }}
    steps:
      - name: Checkout exact dependency inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.target == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha || github.sha }}
          path: dependency-input
          persist-credentials: false

      - name: Checkout reviewed SharedKernel generator source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: danigutsch/PandaBear.SharedKernel
          ref: ${{ env.SNAPSHOT_GENERATOR_REVISION }}
          path: .local/dependency-library
          persist-credentials: false

      - name: Verify exact clean generator source
        shell: pwsh
        working-directory: .local/dependency-library
        env:
          GENERATOR_REVISION: ${{ env.SNAPSHOT_GENERATOR_REVISION }}
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect generator source revision.' }
          $dirty = git status --porcelain
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect generator source cleanliness.' }
          if ($revision -cne $env:GENERATOR_REVISION -or $dirty) {
            throw 'Dependency snapshots require the exact clean reviewed generator source.'
          }

      - name: Set up generator SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: .local/dependency-library/global.json

      - name: Build dependency-independent snapshot generator
        working-directory: .local/dependency-library
        run: |
          dotnet restore tools/SharedKernel.RepoConfig.Tool --locked-mode
          dotnet build tools/SharedKernel.RepoConfig.Tool -c Release --no-restore

      - name: Generate snapshot from committed lock files
        shell: pwsh
        env:
          SNAPSHOT_SHA: ${{ matrix.target == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha || github.sha }}
          SNAPSHOT_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', matrix.target == 'base' && github.base_ref || github.head_ref) || github.ref }}
          SNAPSHOT_JOB_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'dependency-input'
          $generator = Join-Path $env:GITHUB_WORKSPACE '.local/dependency-library/tools/SharedKernel.RepoConfig.Tool/bin/Release/net10.0/SharedKernel.RepoConfig.Tool.dll'
          $snapshot = Join-Path $root 'TestResults/dependency-snapshot.json'
          dotnet $generator dependency snapshot --root $root --sha $env:SNAPSHOT_SHA --ref $env:SNAPSHOT_REF --job $env:SNAPSHOT_JOB_ID --correlator viajantes-solution-nuget --output $snapshot
          if ($LASTEXITCODE -ne 0) { throw 'Committed dependency snapshot generation failed.' }

      - name: Submit complete committed dependency snapshot
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $snapshot = Join-Path $env:GITHUB_WORKSPACE 'dependency-input/TestResults/dependency-snapshot.json'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/dependency-graph/snapshots" -Headers $headers -ContentType 'application/json' -InFile $snapshot | Out-Null

      - name: Retain committed snapshot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-snapshot-${{ matrix.target }}
          path: dependency-input/TestResults/dependency-snapshot.json
          if-no-files-found: ignore

  dependency-review:
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && 'Ignored label event' || 'Dependency Review' }}
    needs: [plan, dependency-snapshots]
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') && (always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')) }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    steps:
      - name: Require successful snapshot generation when applicable
        env:
          SNAPSHOT_RESULT: ${{ needs.dependency-snapshots.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          test "$PLAN_RESULT" = success
          case "$SNAPSHOT_RESULT" in
            success | skipped) ;;
            *) echo "Dependency snapshot generation did not succeed." >&2; exit 1 ;;
          esac

      - name: Checkout repository
        if: needs.plan.outputs.review_required == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The pinned Action ignores purl versions. Fail before emitting its exception if approval expires.
      # Maintainer renewed this exact preview on 2026-10-23; evidence: docs/ci/dependency-license-evidence.md.
      - name: Validate exact preview license approval
        if: needs.plan.outputs.review_required == 'true'
        id: preview-license
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content '.config/sharedkernel-candidate.json' -Raw | ConvertFrom-Json
          if ($pin.packageVersion -cne '0.1.0-alpha.70.1' -or
              $pin.libraryRevision -cne 'ef0dd0a67b8982dfdf0cb8f5e23224c397971a5b' -or
              $pin.libraryDirty -ne $false) {
            throw 'Preview license approval expired: re-review this candidate before granting an exception.'
          }
          $locks = @(git ls-files -- '**/packages.lock.json')
          if ($LASTEXITCODE -ne 0 -or $locks.Count -eq 0) { throw 'Cannot inspect the tracked dependency graph.' }
          $approved = @{ 'StreamJsonRpc' = '2.25.29'; 'Magick.NET-Q8-AnyCPU' = '15.0.0' }
          $found = @{}
          foreach ($path in $locks) {
            $lock = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -AsHashtable
            foreach ($target in $lock.dependencies.Values) {
              foreach ($entry in $target.GetEnumerator()) {
                if ($approved.ContainsKey($entry.Key)) {
                  if ($entry.Value.resolved -cne $approved[$entry.Key]) {
                    throw "License approval for $($entry.Key) covers only $($approved[$entry.Key]); found '$($entry.Value.resolved)' in $path."
                  }
                  $found[$entry.Key] = $true
                }
              }
            }
          }
          if ($found.Count -ne $approved.Count) { throw 'An approved package no longer exists in the locked graph; remove its preview exception.' }
          'packages=pkg:nuget/StreamJsonRpc@2.25.29,pkg:nuget/Magick.NET-Q8-AnyCPU@15.0.0' >> $env:GITHUB_OUTPUT

      - name: Dependency Review
        if: needs.plan.outputs.review_required == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          license-check: true
          vulnerability-check: true
          # Informational scorecards perform serial external lookups for repeated manifest entries.
          show-openssf-scorecard: false
          allow-dependencies-licenses: ${{ steps.preview-license.outputs.packages }}
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, ISC, PostgreSQL, Zlib,
            Unlicense, CC0-1.0

      - name: Report unchanged dependency inputs
        if: needs.plan.outputs.review_required == 'false'
        run: echo "Only standalone documentation changed; see dependency-review-plan evidence."

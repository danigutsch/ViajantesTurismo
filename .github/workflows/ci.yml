name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build_required: ${{ steps.change-scope.outputs.build_required }}
      fast_validation_1_required: ${{ steps.change-scope.outputs.fast_validation_1_required }}
      fast_validation_2_required: ${{ steps.change-scope.outputs.fast_validation_2_required }}
      admin_integration_required: ${{ steps.change-scope.outputs.admin_integration_required }}
      admin_api_integration_required: ${{ steps.change-scope.outputs.admin_api_integration_required }}
      admin_system_required: ${{ steps.change-scope.outputs.admin_system_required }}
      mediator_heavy_required: ${{ steps.change-scope.outputs.mediator_heavy_required }}
      openapi_tool_windows_required: ${{ steps.change-scope.outputs.openapi_tool_windows_required }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI selection tool
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          restore-local-tools: "false"
          restore-targets: tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj
          trust-dev-certificate: "false"

      - name: Select affected CI test projects
        id: change-scope
        shell: bash
        env:
          SELECTION_MODE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha != '' && github.event.pull_request.head.sha != '' && 'merge-base' || 'full' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dotnet run \
            --project tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj \
            --no-restore \
            -- \
            select-ci-test-projects \
            --mode "${SELECTION_MODE}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --output-directory TestResults/selected-ci-test-slices \
            --github-output "${GITHUB_OUTPUT}"

      - name: Upload selected CI test projects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: ci-selected-test-projects
          path: TestResults/selected-ci-test-slices/*.txt
          retention-days: 1

  calculate-version:
    name: Calculate Version
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      source_tag: ${{ steps.version.outputs.source_tag }}
      version_json: ${{ steps.version.outputs.version_json }}
      sem_ver: ${{ steps.version.outputs.sem_ver }}
      release_impact: ${{ steps.version.outputs.release_impact }}
      package_version: ${{ steps.version.outputs.package_version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      file_version: ${{ steps.version.outputs.file_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI prerequisites
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          restore-local-tools: "false"
          restore-targets: tools/SharedKernel.Versioning.Tool/SharedKernel.Versioning.Tool.csproj
          trust-dev-certificate: "false"

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          dotnet run \
            --project tools/SharedKernel.Versioning.Tool/SharedKernel.Versioning.Tool.csproj \
            --no-restore \
            -- \
            calculate-release \
            --run-number "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --github-output "${GITHUB_OUTPUT}" \
            --github-summary "${GITHUB_STEP_SUMMARY}"

  openapi-tool-windows:
    name: OpenAPI Tool Windows
    needs:
      - detect-changes
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Skip OpenAPI tool tests when not required
        if: ${{ needs.detect-changes.outputs.openapi_tool_windows_required != 'true' }}
        shell: bash
        run: |
          echo "OpenAPI tool tests were not required for this change set."

      - name: Checkout repository
        if: ${{ needs.detect-changes.outputs.openapi_tool_windows_required == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI prerequisites
        if: ${{ needs.detect-changes.outputs.openapi_tool_windows_required == 'true' }}
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          restore-local-tools: "false"
          restore-targets: |
            tests/ViajantesTurismo.OpenApi.Tool.Tests/ViajantesTurismo.OpenApi.Tool.Tests.csproj
            src/ViajantesTurismo.Admin.ApiService/ViajantesTurismo.Admin.ApiService.csproj
            src/ViajantesTurismo.Branding.ApiService/ViajantesTurismo.Branding.ApiService.csproj
            src/ViajantesTurismo.Catalog.ApiService/ViajantesTurismo.Catalog.ApiService.csproj
          trust-dev-certificate: "false"

      - name: Run OpenAPI tool tests
        if: ${{ needs.detect-changes.outputs.openapi_tool_windows_required == 'true' }}
        run: dotnet test --project tests/ViajantesTurismo.OpenApi.Tool.Tests/ViajantesTurismo.OpenApi.Tool.Tests.csproj --no-restore

  test-slices:
    name: ${{ matrix.display_name }}
    needs:
      - detect-changes
    if: ${{ always() }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fast-validation-1
            display_name: Fast Validation 1
            change_output: fast_validation_1_required
            projects_file: scripts/ci-test-slices/fast-validation-1.txt
            timeout_minutes: 15
            install_playwright: false
            playwright_outcome: not-applicable
          - id: fast-validation-2
            display_name: Fast Validation 2
            change_output: fast_validation_2_required
            projects_file: scripts/ci-test-slices/fast-validation-2.txt
            timeout_minutes: 15
            install_playwright: false
            playwright_outcome: not-applicable
          - id: admin-integration
            display_name: Admin Integration Tests
            change_output: admin_integration_required
            projects_file: scripts/ci-test-slices/admin-integration.txt
            timeout_minutes: 15
            install_playwright: false
            playwright_outcome: not-applicable
          - id: admin-api-integration
            display_name: Admin API Integration Tests
            change_output: admin_api_integration_required
            projects_file: scripts/ci-test-slices/admin-api-integration.txt
            timeout_minutes: 15
            install_playwright: false
            playwright_outcome: not-applicable
          - id: mediator-heavy
            display_name: Mediator Heavy Tests
            change_output: mediator_heavy_required
            projects_file: scripts/ci-test-slices/mediator-heavy.txt
            timeout_minutes: 15
            install_playwright: false
            playwright_outcome: not-applicable
          - id: admin-system
            display_name: Admin System Tests
            change_output: admin_system_required
            projects_file: scripts/ci-test-slices/admin-system.txt
            timeout_minutes: 30
            install_playwright: true
            playwright_outcome: included-in-test-slice
    steps:
      - name: Fail test slice when change detection fails
        if: ${{ needs.detect-changes.result != 'success' }}
        shell: bash
        run: |
          echo "Detect Changes failed." >&2
          exit 1

      - name: Skip test slice when not required
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[matrix.change_output] != 'true' }}
        shell: bash
        run: |
          echo "${{ matrix.display_name }} was not required for this change set."
          {
            echo "## ${{ matrix.display_name }}"
            echo
            echo "This test slice was skipped because no matching paths changed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[matrix.change_output] == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI prerequisites
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[matrix.change_output] == 'true' }}
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          restore-local-tools: "false"
          restore-targets-file: ${{ matrix.projects_file }}

      - name: Run test slice
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[matrix.change_output] == 'true' }}
        id: run-test-slice
        env:
          INSTALL_PLAYWRIGHT: ${{ matrix.install_playwright }}
        run: |
          set -o pipefail
          mkdir -p TestResults
          args=(--slice-name "${{ matrix.display_name }}")
          if [[ "${INSTALL_PLAYWRIGHT}" == "true" ]]; then
            args+=(--install-playwright)
          fi
          args+=(--projects-file "${{ matrix.projects_file }}")
          bash scripts/run-ci-test-slice.sh "${args[@]}"

      - name: Capture test slice diagnostics
        if: ${{ failure() && steps.run-test-slice.outcome != 'skipped' }}
        env:
          BUILD_OUTCOME: included-in-test-slice
          PLAYWRIGHT_OUTCOME: ${{ matrix.playwright_outcome }}
          TEST_OUTCOME: ${{ steps.run-test-slice.outcome }}
        run: |
          bash scripts/collect-ci-build-test-diagnostics.sh \
            "$BUILD_OUTCOME" \
            "$PLAYWRIGHT_OUTCOME" \
            "$TEST_OUTCOME"

      - name: Upload test slice diagnostics
        id: upload-test-slice-diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() && steps.run-test-slice.outcome != 'skipped' }}
        with:
          if-no-files-found: error
          name: ci-test-slice-${{ matrix.id }}-diagnostics
          path: TestResults/ci-diagnostics/**
          retention-days: 7

      - name: Upload test slice results
        id: upload-test-slice-results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && steps.run-test-slice.outcome != 'skipped' }}
        with:
          if-no-files-found: ignore
          name: ci-test-slice-${{ matrix.id }}-results
          path: |
            **/TestResults/**
            !TestResults/ci-diagnostics/**
          retention-days: 7

      - name: Report test slice artifacts
        if: ${{ always() && steps.run-test-slice.outcome != 'skipped' }}
        env:
          DIAGNOSTICS_ARTIFACT_URL: ${{ steps.upload-test-slice-diagnostics.outputs.artifact-url }}
          RESULTS_ARTIFACT_URL: ${{ steps.upload-test-slice-results.outputs.artifact-url }}
        run: bash scripts/write-ci-artifact-summary.sh "${{ matrix.display_name }}"

  build-and-test:
    name: Build and Test
    needs:
      - detect-changes
      - test-slices
      - openapi-tool-windows
    if: ${{ always() }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Report Build and Test status
        shell: bash
        run: |
          if [[ "${{ needs.detect-changes.result }}" != "success" ]]; then
              echo "Detect Changes failed." >&2
              exit 1
          fi

          if [[ "${{ needs.detect-changes.outputs.build_required }}" != "true" ]]; then
              echo "Build and Test was skipped because only documentation changes were detected."
              exit 0
          fi

          if [[ "${{ needs.test-slices.result }}" != "success" ]]; then
              echo "One or more test slices failed." >&2
              exit 1
          fi

          if [[ "${{ needs.openapi-tool-windows.result }}" != "success" ]]; then
              echo "OpenAPI Tool Windows failed." >&2
              exit 1
          fi

          echo "Build and Test completed successfully across the validation slices."
          exit 0

  api-compatibility:
    name: API Compatibility
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI prerequisites
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          restore-local-tools: "false"
          restore-targets: tools/SharedKernel.Versioning.Tool/SharedKernel.Versioning.Tool.csproj
          trust-dev-certificate: "false"

      - name: Check PublicAPI baselines
        shell: bash
        run: |
          dotnet run \
            --project tools/SharedKernel.Versioning.Tool/SharedKernel.Versioning.Tool.csproj \
            --no-restore \
            -- \
            check-public-api-baselines

      - name: Detect breaking-change marker
        id: breaking-marker
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set +e
          marker_output=$(dotnet run \
            --project tools/SharedKernel.Versioning.Tool/SharedKernel.Versioning.Tool.csproj \
            --no-restore \
            -- \
            has-breaking-change-marker "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" 2>&1)
          marker_exit=$?
          set -e
          if [[ "${marker_exit}" -eq 0 ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${marker_output}" == *"No breaking-change marker found"* ]]; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "${marker_output}" >&2
            exit "${marker_exit}"
          fi

      - name: Run API compatibility report
        shell: bash
        env:
          BREAKING_MARKER: ${{ steps.breaking-marker.outputs.present || 'false' }}
        run: |
          args=(
            api-compatibility
            --release-phase alpha
            --version "0.1.0-alpha.ci.${{ github.run_number }}"
          )
          if [[ "${BREAKING_MARKER}" == "true" ]]; then
            args+=(--breaking-marker)
          fi
          dotnet run \
            --project tools/SharedKernel.Versioning.Tool/SharedKernel.Versioning.Tool.csproj \
            --no-restore \
            -- "${args[@]}"

      - name: Upload API compatibility report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          if-no-files-found: ignore
          name: api-compatibility-report
          path: artifacts/api-compat/**
          retention-days: 14

  quality-gate:
    name: Quality Gate
    needs:
      - detect-changes
      - test-slices
    if: ${{ always() }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require successful change selection and tests
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.detect-changes.result }}
          TEST_RESULT: ${{ needs.test-slices.result }}
        run: |
          test "$SELECTION_RESULT" = success
          test "$TEST_RESULT" = success

      - name: Checkout repository
        if: ${{ needs.detect-changes.outputs.build_required == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up quality tooling
        if: ${{ needs.detect-changes.outputs.build_required == 'true' }}
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          restore-targets: ViajantesTurismo.slnx
          trust-dev-certificate: "false"

      - name: Build all solution projects
        if: ${{ needs.detect-changes.outputs.build_required == 'true' }}
        run: dotnet build ViajantesTurismo.slnx -c Release --no-restore

      - name: Download test slice coverage
        if: ${{ needs.detect-changes.outputs.build_required == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-test-slice-*-results
          path: artifacts
          merge-multiple: false

      - name: Merge coverage reports
        if: ${{ needs.detect-changes.outputs.build_required == 'true' }}
        shell: bash
        run: |
          dotnet tool run reportgenerator \
            "-reports:artifacts/**/*.cobertura*.xml" \
            "-targetdir:TestResults/CoverageReport" \
            "-reporttypes:Html;Cobertura"
          test -s TestResults/CoverageReport/Cobertura.xml

      - name: Enforce changed-code coverage
        if: ${{ needs.detect-changes.outputs.build_required == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"
          git -c core.quotePath=false diff --no-ext-diff --unified=0 --find-renames \
            "$BASE_SHA...$HEAD_SHA" -- '*.cs' '*.razor' > TestResults/coverage-changes.patch
          dotnet run --project tools/SharedKernel.RepoConfig.Tool -c Release --no-restore -- \
            verify-coverage --report TestResults/CoverageReport/Cobertura.xml \
            --diff TestResults/coverage-changes.patch

      - name: Upload quality evidence
        if: ${{ always() && needs.detect-changes.outputs.build_required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: quality-evidence
          path: |
            TestResults/CoverageReport/**
            TestResults/coverage-gate.json
            TestResults/coverage-changes.patch
          retention-days: 14

  lint:
    name: Lint
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Get changed Markdown files
        if: ${{ github.event_name == 'pull_request' }}
        id: changed-markdown-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            README.md
            docs/**/*.md
            .github/**/*.md
            .devcontainer/**/*.md
            src/**/*.md
            tests/**/*.md
            benchmarks/**/*.md
            samples/**/*.md
          separator: ","

      - name: Lint changed Markdown files in pull requests
        if: ${{ github.event_name == 'pull_request' && steps.changed-markdown-files.outputs.any_changed == 'true' }}
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: ${{ steps.changed-markdown-files.outputs.all_changed_files }}
          config: .markdownlint-cli2.jsonc
          separator: ","

      - name: Lint all Markdown files on mainline runs
        if: ${{ github.event_name != 'pull_request' }}
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: |
            README.md
            docs/**/*.md
            .github/**/*.md
            .devcontainer/**/*.md
            src/**/*.md
            tests/**/*.md
            benchmarks/**/*.md
            samples/**/*.md
          config: .markdownlint-cli2.jsonc

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Run repository linters
        run: bash scripts/lint-all.sh --skip-markdown

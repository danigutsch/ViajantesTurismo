name: CI

on:
  pull_request:
    types:
      - opened
      - labeled
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && github.run_id || 'validation' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:rerun' }}
    name: Detect Changes
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.change-scope.outputs.base_sha }}
      build_required: ${{ steps.change-scope.outputs.build_required }}
      fast-validation-1_required: ${{ steps.change-scope.outputs['fast-validation-1_required'] }}
      fast-validation-2_required: ${{ steps.change-scope.outputs['fast-validation-2_required'] }}
      hosted-tests_required: ${{ steps.change-scope.outputs['hosted-tests_required'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build SharedKernel CI tool
        uses: ./.github/actions/build-sharedkernel-tool
        with:
          tool: SharedKernel.CI.Tool

      # Pull requests compare the merge commit with its first parent; scheduled and manual runs select everything.
      - name: Select affected CI test projects
        id: change-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) BASE_SHA="$(git rev-parse HEAD^1)" ;;
            push) BASE_SHA="$PUSH_BEFORE" ;;
            merge_group) BASE_SHA="$MERGE_GROUP_BASE" ;;
            *) BASE_SHA="" ;;
          esac
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          dotnet run --project "$SHAREDKERNEL_SOURCE/tools/SharedKernel.CI.Tool" -c Release --no-build -- \
            select --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Upload CI selection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: ci-selection
          path: TestResults/selection/**
          retention-days: 7

  calculate-version:
    needs: detect-changes
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') && needs.detect-changes.outputs.build_required == 'true' }}
    name: Calculate Version
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      source_tag: ${{ steps.version.outputs.source_tag }}
      version_json: ${{ steps.version.outputs.version_json }}
      sem_ver: ${{ steps.version.outputs.sem_ver }}
      release_impact: ${{ steps.version.outputs.release_impact }}
      package_version: ${{ steps.version.outputs.package_version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      file_version: ${{ steps.version.outputs.file_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI prerequisites
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          sharedkernel-library-root: ${{ vars.SHAREDKERNEL_LIBRARY_ROOT }}
          sharedkernel-candidate-feed: ${{ vars.SHAREDKERNEL_CANDIDATE_FEED }}
          trust-dev-certificate: "false"

      - name: Calculate release version
        id: version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          dotnet tool run sharedkernel-version -- \
            calculate-release \
            --run-number "${RUN_NUMBER}" \
            --sha "${SOURCE_SHA}" \
            --github-output "${GITHUB_OUTPUT}" \
            --github-summary "${GITHUB_STEP_SUMMARY}"

  test-slices:
    name: ${{ matrix.display_name }}
    needs:
      - detect-changes
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') && (always()) && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.build_required == 'true') }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fast-validation-1
            display_name: Fast Validation 1
            timeout_minutes: 15
          - id: fast-validation-2
            display_name: Fast Validation 2
            timeout_minutes: 15
          - id: hosted-tests
            display_name: Hosted Integration and System Tests
            timeout_minutes: 30
    steps:
      - name: Fail test slice when change detection fails
        if: ${{ needs.detect-changes.result != 'success' }}
        shell: bash
        run: |
          echo "Detect Changes failed." >&2
          exit 1

      - name: Skip test slice when not required
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[format('{0}_required', matrix.id)] != 'true' }}
        shell: bash
        run: |
          echo "${{ matrix.display_name }} was not required for this change set."
          {
            echo "## ${{ matrix.display_name }}"
            echo
            echo "This test slice was skipped because no selected test project belongs to it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[format('{0}_required', matrix.id)] == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI prerequisites
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[format('{0}_required', matrix.id)] == 'true' }}
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          sharedkernel-library-root: ${{ vars.SHAREDKERNEL_LIBRARY_ROOT }}
          sharedkernel-candidate-feed: ${{ vars.SHAREDKERNEL_CANDIDATE_FEED }}
          restore-local-tools: ${{ matrix.id == 'fast-validation-2' && 'true' || 'false' }}

      - name: Download CI selection
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[format('{0}_required', matrix.id)] == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-selection
          path: TestResults/selection

      # Playwright 1.60 has no Ubuntu 26.04 browser manifests yet (microsoft/playwright#40117), so it installs the
      # Ubuntu 24.04 builds and dependencies there.
      - name: Select the Playwright host platform
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[format('{0}_required', matrix.id)] == 'true' && matrix.id == 'hosted-tests' }}
        shell: bash
        run: |
          . /etc/os-release
          if [[ "${ID:-}" == ubuntu && "${VERSION_ID:-}" == 26.04 ]]; then
            case "$(uname -m)" in
              x86_64) echo "PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64" >> "$GITHUB_ENV" ;;
              aarch64) echo "PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-arm64" >> "$GITHUB_ENV" ;;
            esac
          fi

      - name: Run test slice
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[format('{0}_required', matrix.id)] == 'true' }}
        id: run-test-slice
        shell: bash
        env:
          SLICE: ${{ matrix.id }}
        run: |
          dotnet run --project "$SHAREDKERNEL_SOURCE/tools/SharedKernel.CI.Tool" -c Release --no-build -- \
            run --slice "$SLICE" --coverage --install-playwright --playwright-dependencies --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Report the .NET environment
        if: failure()
        run: dotnet --info

      - name: Upload test slice results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.run-test-slice.outcome != 'skipped' }}
        with:
          if-no-files-found: ignore
          name: ci-test-slice-${{ matrix.id }}-results
          path: "**/TestResults/**"
          retention-days: 7

      - name: Write test warning report
        if: ${{ !cancelled() && steps.run-test-slice.outcome != 'skipped' }}
        shell: bash
        env:
          SLICE: ${{ matrix.id }}
          OUTCOME: ${{ steps.run-test-slice.outcome }}
        run: |
          mkdir -p warning-reports
          dotnet run --project "$SHAREDKERNEL_SOURCE/tools/SharedKernel.CI.Tool" -c Release --no-build -- warning-report --tool "Tests $SLICE" --outcome "$OUTCOME" --report "warning-reports/tests-$SLICE-warnings.json"

      - name: Upload warning report
        if: ${{ !cancelled() && steps.run-test-slice.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: warning-report-tests-${{ matrix.id }}
          path: warning-reports/tests-${{ matrix.id }}-warnings.json
          retention-days: 7

  build-and-test:
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && 'Ignored label event' || 'Build and Test' }}
    needs:
      - detect-changes
      - test-slices
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') && (always()) }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Report Build and Test status
        shell: bash
        run: |
          if [[ "${{ needs.detect-changes.result }}" != "success" ]]; then
              echo "Detect Changes failed." >&2
              exit 1
          fi

          if [[ "${{ needs.detect-changes.outputs.build_required }}" != "true" ]]; then
              echo "Build and Test was skipped because only documentation changes were detected."
              exit 0
          fi

          if [[ "${{ needs.test-slices.result }}" != "success" ]]; then
              echo "One or more test slices failed." >&2
              exit 1
          fi

          echo "Build and Test completed successfully across the validation slices."
          exit 0

  solution-build:
    name: Solution Build
    needs: detect-changes
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') && needs.detect-changes.outputs.build_required == 'true' }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-prerequisites
        with:
          sharedkernel-library-root: ${{ vars.SHAREDKERNEL_LIBRARY_ROOT }}
          sharedkernel-candidate-feed: ${{ vars.SHAREDKERNEL_CANDIDATE_FEED }}
          restore-local-tools: "false"
          trust-dev-certificate: "false"
      - name: Restore all solution projects
        id: restore
        shell: bash
        run: |
          mkdir -p TestResults
          dotnet restore ViajantesTurismo.slnx --locked-mode 2>&1 | tee TestResults/restore.log
      - name: Verify restore and audit warnings
        id: verify-restore
        if: ${{ !cancelled() && steps.restore.outcome != 'skipped' }}
        run: dotnet run --project "$SHAREDKERNEL_SOURCE/tools/SharedKernel.CI.Tool" -c Release --no-build -- verify-restore-warnings --log TestResults/restore.log --report TestResults/restore-warnings.json --exceptions .github/ci-warning-exceptions.json
      - name: Build all solution projects
        id: build
        run: dotnet build ViajantesTurismo.slnx -c Release --no-restore
      - name: Write build warning report
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        run: dotnet run --project "$SHAREDKERNEL_SOURCE/tools/SharedKernel.CI.Tool" -c Release --no-build -- warning-report --tool Build --outcome "${{ steps.build.outcome }}" --report TestResults/build-warnings.json
      - name: Upload warning reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: warning-report-solution-build
          path: |
            TestResults/restore-warnings.json
            TestResults/build-warnings.json
          retention-days: 7
      - name: Record revision and symbol hashes
        run: dotnet run --project "$SHAREDKERNEL_SOURCE/tools/SharedKernel.CI.Tool" -c Release --no-build -- coverage record-symbols
      - name: Upload build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solution-build-evidence
          if-no-files-found: error
          path: |
            TestResults/symbol-evidence.json
            src/**/bin/Release/**/*.pdb
          retention-days: 7

  quality-gate:
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && 'Ignored label event' || 'Quality Gate' }}
    needs:
      - detect-changes
      - test-slices
      - solution-build
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') && (always()) }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require successful change selection and tests
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.detect-changes.result }}
          TEST_RESULT: ${{ needs.test-slices.result }}
          BUILD_REQUIRED: ${{ needs.detect-changes.outputs.build_required }}
          BUILD_RESULT: ${{ needs.solution-build.result }}
        run: |
          test "$SELECTION_RESULT" = success
          case "$BUILD_REQUIRED" in
            true) test "$TEST_RESULT" = success && test "$BUILD_RESULT" = success ;;
            false) test "$TEST_RESULT" = skipped && test "$BUILD_RESULT" = skipped ;;
            *) echo "Missing build selection evidence." >&2; exit 1 ;;
          esac

      - name: Checkout repository
        if: ${{ needs.detect-changes.outputs.build_required == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build SharedKernel CI tool
        if: ${{ needs.detect-changes.outputs.build_required == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        uses: ./.github/actions/build-sharedkernel-tool
        with:
          tool: SharedKernel.CI.Tool

      - name: Download build evidence
        if: ${{ needs.detect-changes.outputs.build_required == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: solution-build-evidence
          path: .

      - name: Download test slice coverage
        if: ${{ needs.detect-changes.outputs.build_required == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-test-slice-*-results
          path: artifacts
          merge-multiple: false

      - name: Enforce changed-code coverage
        if: ${{ needs.detect-changes.outputs.build_required == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        shell: bash
        env:
          BASE_SHA: ${{ needs.detect-changes.outputs.base_sha }}
        run: |
          dotnet run --project "$SHAREDKERNEL_SOURCE/tools/SharedKernel.CI.Tool" -c Release --no-build -- \
            coverage verify --report artifacts --base "$BASE_SHA" --symbols TestResults/symbol-evidence.json

      - name: Upload quality evidence
        if: ${{ always() && needs.detect-changes.outputs.build_required == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: quality-evidence
          path: TestResults/coverage-gate.json
          retention-days: 14

  warning-summary:
    name: Warning Summary
    needs:
      - test-slices
      - solution-build
      - lint
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') && !cancelled() }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-prerequisites
        with:
          sharedkernel-library-root: ${{ vars.SHAREDKERNEL_LIBRARY_ROOT }}
          sharedkernel-candidate-feed: ${{ vars.SHAREDKERNEL_CANDIDATE_FEED }}
          restore-local-tools: "false"
          trust-dev-certificate: "false"
      - name: Download warning reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: warning-report-*
          path: warning-reports
          merge-multiple: true
      - name: Publish CI warning summary
        shell: bash
        run: |
          reports=()
          for report in warning-reports/*.json; do
            test -e "$report" && reports+=(--report "$report")
          done
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No warning reports were produced; no required job ran." >> "$GITHUB_STEP_SUMMARY"
          else
            dotnet run --project "$SHAREDKERNEL_SOURCE/tools/SharedKernel.CI.Tool" -c Release --no-build -- warning-summary "${reports[@]}" --summary "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:rerun' }}
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && 'Ignored label event' || 'Lint' }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed Markdown files
        if: ${{ github.event_name == 'pull_request' }}
        id: changed-markdown-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            README.md
            AGENTS.md
            CONTRIBUTING.md
            SECURITY.md
            docs/**/*.md
            .agents/**/*.md
            .github/**/*.md
            .devcontainer/**/*.md
            src/**/*.md
            tests/**/*.md
            benchmarks/**/*.md
            samples/**/*.md
          separator: ","

      - name: Lint changed Markdown files in pull requests
        if: ${{ github.event_name == 'pull_request' && steps.changed-markdown-files.outputs.any_changed == 'true' }}
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: ${{ steps.changed-markdown-files.outputs.all_changed_files }}
          config: .markdownlint-cli2.jsonc
          separator: ","

      - name: Lint all Markdown files on mainline runs
        if: ${{ github.event_name != 'pull_request' }}
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: |
            README.md
            AGENTS.md
            CONTRIBUTING.md
            SECURITY.md
            docs/**/*.md
            .agents/**/*.md
            .github/**/*.md
            .devcontainer/**/*.md
            src/**/*.md
            tests/**/*.md
            benchmarks/**/*.md
            samples/**/*.md
          config: .markdownlint-cli2.jsonc

      - name: Build SharedKernel repository tool with the action pin check
        uses: ./.github/actions/build-sharedkernel-tool
        with:
          tool: SharedKernel.RepoConfig.Tool
          revision: dca2de14985fc5a18eb9a632ee17705deb50cbe9
          sparse-extra: .github

      - name: Verify action pins
        shell: bash
        run: |
          dotnet "$SHAREDKERNEL_SOURCE"/tools/SharedKernel.RepoConfig.Tool/bin/Release/*/SharedKernel.RepoConfig.Tool.dll \
            verify-action-pins --root . --manifest "$SHAREDKERNEL_SOURCE/.github/action-pins.json"

      - name: Set up CI prerequisites
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          sharedkernel-library-root: ${{ vars.SHAREDKERNEL_LIBRARY_ROOT }}
          sharedkernel-candidate-feed: ${{ vars.SHAREDKERNEL_CANDIDATE_FEED }}
          trust-dev-certificate: "false"

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint shell scripts
        run: shellcheck -- .devcontainer/*.sh scripts/*.sh setup-dev.sh

      - name: Check repository content
        run: |
          dotnet tool run sharedkernel-repo -- verify-text-encoding --root .
          dotnet tool run sharedkernel-repo -- verify-line-endings --root .
          dotnet tool run sharedkernel-repo -- verify-json --root .
          dotnet tool run sharedkernel-repo -- verify-links --root .
          dotnet tool run sharedkernel-repo -- verify-gherkin --root .
          dotnet tool run sharedkernel-repo -- verify-dependabot --root .
          dotnet tool run sharedkernel-repo -- verify --root .

      - name: Check generated documentation
        run: |
          dotnet tool run sharedkernel-docs -- verify --config docs/architecture/generated-diagrams.json
          dotnet tool run sharedkernel-docs -- check --config docs/architecture/documentation-conformance.json

      - name: Write lint warning report
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OUTCOME: ${{ job.status }}
        run: |
          mkdir -p warning-reports
          dotnet run --project "$SHAREDKERNEL_SOURCE/tools/SharedKernel.CI.Tool" -c Release --no-build -- warning-report --tool Lint --outcome "$OUTCOME" --report warning-reports/lint-warnings.json

      - name: Upload warning report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: warning-report-lint
          path: warning-reports/lint-warnings.json
          retention-days: 7

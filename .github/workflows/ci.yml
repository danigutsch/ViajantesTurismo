name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build_required: ${{ steps.change-scope.outputs.build_required }}
      fast_validation_required: ${{ steps.change-scope.outputs.fast_validation_required }}
      admin_integration_required: ${{ steps.change-scope.outputs.admin_integration_required }}
      admin_system_required: ${{ steps.change-scope.outputs.admin_system_required }}
      mediator_heavy_required: ${{ steps.change-scope.outputs.mediator_heavy_required }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: change-scope
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_AFTER_SHA: ${{ github.event.after }}
        run: bash scripts/detect-changes.sh

  calculate-version:
    name: Calculate Version
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      source_tag: ${{ steps.version.outputs.source_tag }}
      version_json: ${{ steps.version.outputs.version_json }}
      sem_ver: ${{ steps.version.outputs.sem_ver }}
      release_impact: ${{ steps.version.outputs.release_impact }}
      package_version: ${{ steps.version.outputs.package_version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      file_version: ${{ steps.version.outputs.file_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI prerequisites
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          restore-targets: tools/SharedKernel.Versioning.Tool/SharedKernel.Versioning.Tool.csproj
          trust-dev-certificate: "false"

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          dotnet run \
            --project tools/SharedKernel.Versioning.Tool/SharedKernel.Versioning.Tool.csproj \
            --no-restore \
            -- \
            calculate-release \
            --run-number "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --github-output "${GITHUB_OUTPUT}" \
            --github-summary "${GITHUB_STEP_SUMMARY}"

  openapi-tool-windows:
    name: OpenAPI Tool Windows
    needs:
      - detect-changes
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Skip OpenAPI tool tests when not required
        if: ${{ needs.detect-changes.outputs.build_required != 'true' }}
        shell: bash
        run: |
          echo "OpenAPI tool tests were not required for this change set."

      - name: Checkout repository
        if: ${{ needs.detect-changes.outputs.build_required == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI prerequisites
        if: ${{ needs.detect-changes.outputs.build_required == 'true' }}
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          restore-targets: |
            tests/ViajantesTurismo.OpenApi.Tool.Tests/ViajantesTurismo.OpenApi.Tool.Tests.csproj
            src/ViajantesTurismo.Admin.ApiService/ViajantesTurismo.Admin.ApiService.csproj
            src/ViajantesTurismo.Branding.ApiService/ViajantesTurismo.Branding.ApiService.csproj
            src/ViajantesTurismo.Catalog.ApiService/ViajantesTurismo.Catalog.ApiService.csproj
          trust-dev-certificate: "false"

      - name: Run OpenAPI tool tests
        if: ${{ needs.detect-changes.outputs.build_required == 'true' }}
        run: dotnet test --project tests/ViajantesTurismo.OpenApi.Tool.Tests/ViajantesTurismo.OpenApi.Tool.Tests.csproj --no-restore

  test-slices:
    name: ${{ matrix.display_name }}
    needs:
      - detect-changes
    if: ${{ always() }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fast-validation
            display_name: Fast Validation
            change_output: fast_validation_required
            projects_file: scripts/ci-test-slices/fast-validation.txt
            timeout_minutes: 15
            install_playwright: false
            playwright_outcome: not-applicable
          - id: admin-integration
            display_name: Admin Integration Tests
            change_output: admin_integration_required
            projects_file: scripts/ci-test-slices/admin-integration.txt
            timeout_minutes: 15
            install_playwright: false
            playwright_outcome: not-applicable
          - id: admin-api-integration
            display_name: Admin API Integration Tests
            change_output: admin_integration_required
            projects_file: scripts/ci-test-slices/admin-api-integration.txt
            timeout_minutes: 15
            install_playwright: false
            playwright_outcome: not-applicable
          - id: mediator-heavy
            display_name: Mediator Heavy Tests
            change_output: mediator_heavy_required
            projects_file: scripts/ci-test-slices/mediator-heavy.txt
            timeout_minutes: 15
            install_playwright: false
            playwright_outcome: not-applicable
          - id: admin-system
            display_name: Admin System Tests
            change_output: admin_system_required
            projects_file: scripts/ci-test-slices/admin-system.txt
            timeout_minutes: 30
            install_playwright: true
            playwright_outcome: included-in-test-slice
    steps:
      - name: Fail test slice when change detection fails
        if: ${{ needs.detect-changes.result != 'success' }}
        shell: bash
        run: |
          echo "Detect Changes failed." >&2
          exit 1

      - name: Skip test slice when not required
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[matrix.change_output] != 'true' }}
        shell: bash
        run: |
          echo "${{ matrix.display_name }} was not required for this change set."
          {
            echo "## ${{ matrix.display_name }}"
            echo
            echo "This test slice was skipped because no matching paths changed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[matrix.change_output] == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI prerequisites
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[matrix.change_output] == 'true' }}
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          restore-targets-file: ${{ matrix.projects_file }}

      - name: Run test slice
        if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs[matrix.change_output] == 'true' }}
        id: run-test-slice
        env:
          INSTALL_PLAYWRIGHT: ${{ matrix.install_playwright }}
        run: |
          set -o pipefail
          mkdir -p TestResults
          args=(--slice-name "${{ matrix.display_name }}")
          if [[ "${INSTALL_PLAYWRIGHT}" == "true" ]]; then
            args+=(--install-playwright)
          fi
          args+=(--projects-file "${{ matrix.projects_file }}")
          bash scripts/run-ci-test-slice.sh "${args[@]}"

      - name: Capture test slice diagnostics
        if: ${{ failure() && steps.run-test-slice.outcome != 'skipped' }}
        env:
          BUILD_OUTCOME: included-in-test-slice
          PLAYWRIGHT_OUTCOME: ${{ matrix.playwright_outcome }}
          TEST_OUTCOME: ${{ steps.run-test-slice.outcome }}
        run: |
          bash scripts/collect-ci-build-test-diagnostics.sh \
            "$BUILD_OUTCOME" \
            "$PLAYWRIGHT_OUTCOME" \
            "$TEST_OUTCOME"

      - name: Upload test slice diagnostics
        id: upload-test-slice-diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() && steps.run-test-slice.outcome != 'skipped' }}
        with:
          if-no-files-found: error
          name: ci-test-slice-${{ matrix.id }}-diagnostics
          path: TestResults/ci-diagnostics/**
          retention-days: 7

      - name: Upload test slice results
        id: upload-test-slice-results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && steps.run-test-slice.outcome != 'skipped' }}
        with:
          if-no-files-found: ignore
          name: ci-test-slice-${{ matrix.id }}-results
          path: |
            **/TestResults/**
            !TestResults/ci-diagnostics/**
          retention-days: 7

      - name: Report test slice artifacts
        if: ${{ always() && steps.run-test-slice.outcome != 'skipped' }}
        env:
          DIAGNOSTICS_ARTIFACT_URL: ${{ steps.upload-test-slice-diagnostics.outputs.artifact-url }}
          RESULTS_ARTIFACT_URL: ${{ steps.upload-test-slice-results.outputs.artifact-url }}
        run: bash scripts/write-ci-artifact-summary.sh "${{ matrix.display_name }}"

  build-and-test:
    name: Build and Test
    needs:
      - detect-changes
      - test-slices
      - openapi-tool-windows
    if: ${{ always() }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Report Build and Test status
        shell: bash
        run: |
          if [[ "${{ needs.detect-changes.result }}" != "success" ]]; then
              echo "Detect Changes failed." >&2
              exit 1
          fi

          if [[ "${{ needs.detect-changes.outputs.build_required }}" != "true" ]]; then
              echo "Build and Test was skipped because only documentation changes were detected."
              exit 0
          fi

          if [[ "${{ needs.test-slices.result }}" != "success" ]]; then
              echo "One or more test slices failed." >&2
              exit 1
          fi

          if [[ "${{ needs.openapi-tool-windows.result }}" != "success" ]]; then
              echo "OpenAPI Tool Windows failed." >&2
              exit 1
          fi

          echo "Build and Test completed successfully across the validation slices."
          exit 0

  api-compatibility:
    name: API Compatibility
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CI prerequisites
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          restore-targets: tools/SharedKernel.Versioning.Tool/SharedKernel.Versioning.Tool.csproj
          trust-dev-certificate: "false"

      - name: Check PublicAPI baselines
        shell: bash
        run: |
          dotnet run \
            --project tools/SharedKernel.Versioning.Tool/SharedKernel.Versioning.Tool.csproj \
            --no-restore \
            -- \
            check-public-api-baselines

      - name: Detect breaking-change marker
        id: breaking-marker
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set +e
          marker_output=$(dotnet run \
            --project tools/SharedKernel.Versioning.Tool/SharedKernel.Versioning.Tool.csproj \
            --no-restore \
            -- \
            has-breaking-change-marker "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" 2>&1)
          marker_exit=$?
          set -e
          if [[ "${marker_exit}" -eq 0 ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${marker_output}" == *"No breaking-change marker found"* ]]; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "${marker_output}" >&2
            exit "${marker_exit}"
          fi

      - name: Run API compatibility report
        shell: bash
        env:
          BREAKING_MARKER: ${{ steps.breaking-marker.outputs.present || 'false' }}
        run: |
          args=(
            api-compatibility
            --release-phase alpha
            --version "0.1.0-alpha.ci.${{ github.run_number }}"
          )
          if [[ "${BREAKING_MARKER}" == "true" ]]; then
            args+=(--breaking-marker)
          fi
          dotnet run \
            --project tools/SharedKernel.Versioning.Tool/SharedKernel.Versioning.Tool.csproj \
            --no-restore \
            -- "${args[@]}"

      - name: Upload API compatibility report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          if-no-files-found: ignore
          name: api-compatibility-report
          path: artifacts/api-compat/**
          retention-days: 14

  sonarcloud:
    name: SonarCloud
    needs:
      - detect-changes
      - test-slices
    if: ${{ always() }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: Determine SonarCloud trust boundary
        id: sonar-boundary
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" && "${HEAD_REPO}" != "${REPOSITORY}" ]]; then
            echo "can_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=fork-pull-request" >> "$GITHUB_OUTPUT"
          else
            echo "can_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=trusted-ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip SonarCloud for fork pull requests
        if: ${{ steps.sonar-boundary.outputs.can_run != 'true' }}
        shell: bash
        run: |
          echo "SonarCloud analysis is skipped for fork pull requests because SONAR_TOKEN is not exposed to untrusted forks."
          {
            echo "## SonarCloud"
            echo
            echo "SonarCloud analysis was skipped because this pull request comes from a fork and the job depends on repository secrets."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip SonarCloud for docs-only changes
        if: ${{ steps.sonar-boundary.outputs.can_run == 'true' && needs.detect-changes.outputs.build_required != 'true' }}
        shell: bash
        run: |
          echo "SonarCloud analysis was skipped because only documentation changes were detected."
          {
            echo "## SonarCloud"
            echo
            echo "Only documentation changes were detected, so hosted analysis was skipped by design."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: ${{ steps.sonar-boundary.outputs.can_run == 'true' && needs.detect-changes.outputs.build_required == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate SonarCloud configuration
        if: ${{ steps.sonar-boundary.outputs.can_run == 'true' && needs.detect-changes.outputs.build_required == 'true' }}
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bash scripts/validate-sonar-analysis-config.sh

      - name: Set up CI prerequisites
        if: ${{ steps.sonar-boundary.outputs.can_run == 'true' && needs.detect-changes.outputs.build_required == 'true' }}
        uses: ./.github/actions/setup-ci-prerequisites

      - name: Cache SonarCloud packages
        if: ${{ steps.sonar-boundary.outputs.can_run == 'true' && needs.detect-changes.outputs.build_required == 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonarcloud-cache-v1
          restore-keys: |
            ${{ runner.os }}-sonarcloud-cache-

      - name: Download test slice results
        if: ${{ steps.sonar-boundary.outputs.can_run == 'true' && needs.detect-changes.outputs.build_required == 'true' && needs.test-slices.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-test-slice-*-results
          path: artifacts
          merge-multiple: false

      - name: Generate Sonar coverage report from test slices
        if: ${{ steps.sonar-boundary.outputs.can_run == 'true' && needs.detect-changes.outputs.build_required == 'true' && needs.test-slices.result == 'success' }}
        run: bash scripts/generate-sonar-coverage-report.sh

      - name: Run SonarCloud analysis
        if: ${{ steps.sonar-boundary.outputs.can_run == 'true' && needs.detect-changes.outputs.build_required == 'true' && needs.test-slices.result == 'success' }}
        id: run-sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ANALYSIS_SKIP_TESTS: true
          SONAR_PULL_REQUEST_KEY: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          mkdir -p TestResults
          bash scripts/run-sonar-analysis.sh 2>&1 | tee TestResults/sonar-analysis.log

      - name: Publish SonarCloud summary to GitHub
        if: ${{ always() && steps.run-sonar.outcome != 'skipped' }}
        env:
          VALIDATION_OUTCOME: ${{ steps.run-sonar.outcome }}
        run: bash scripts/write-github-sonar-summary.sh "$VALIDATION_OUTCOME"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && steps.run-sonar.outcome != 'skipped' }}
        with:
          if-no-files-found: ignore
          name: coverage-report
          path: TestResults/CoverageReport/**
          retention-days: 7

      - name: Upload Sonar coverage input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && steps.run-sonar.outcome != 'skipped' }}
        with:
          if-no-files-found: ignore
          name: sonar-coverage
          path: TestResults/sonar-coverage.xml
          retention-days: 7

      - name: Upload Sonar analysis log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && steps.run-sonar.outcome != 'skipped' }}
        with:
          if-no-files-found: ignore
          name: sonar-analysis-log
          path: TestResults/sonar-analysis.log
          retention-days: 7

      - name: Upload Sonar policy responses
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && steps.run-sonar.outcome != 'skipped' }}
        with:
          if-no-files-found: ignore
          name: sonar-policy-responses
          path: TestResults/sonar-policy-*.json
          retention-days: 7

      - name: Upload Sonar analysis manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && steps.run-sonar.outcome != 'skipped' }}
        with:
          if-no-files-found: ignore
          name: sonar-analysis-manifest
          path: TestResults/ci-validation-manifest.json
          retention-days: 7

      - name: Report SonarCloud status
        shell: bash
        run: |
          if [[ "${{ steps.sonar-boundary.outputs.can_run }}" != "true" ]]; then
              echo "SonarCloud analysis was skipped for a fork pull request because the job depends on repository secrets."
              exit 0
          fi

          if [[ "${{ needs.detect-changes.result }}" != "success" ]]; then
              echo "Detect Changes failed." >&2
              exit 1
          fi

          if [[ "${{ needs.detect-changes.outputs.build_required }}" != "true" ]]; then
              echo "SonarCloud analysis was skipped because only documentation changes were detected."
              exit 0
          fi

          if [[ "${{ needs.test-slices.result }}" != "success" ]]; then
              echo "One or more test slices failed." >&2
              exit 1
          fi

          if [[ "${{ steps.run-sonar.outcome }}" == "success" ]]; then
              echo "SonarCloud analysis completed successfully after aggregating the test slices."
              exit 0
          fi

          echo "SonarCloud analysis failed." >&2
          exit 1

  lint:
    name: Lint
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Get changed Markdown files
        if: ${{ github.event_name == 'pull_request' }}
        id: changed-markdown-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            README.md
            docs/**/*.md
            .github/**/*.md
            .devcontainer/**/*.md
            src/**/*.md
            tests/**/*.md
            benchmarks/**/*.md
            samples/**/*.md
          separator: ","

      - name: Lint changed Markdown files in pull requests
        if: ${{ github.event_name == 'pull_request' && steps.changed-markdown-files.outputs.any_changed == 'true' }}
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: ${{ steps.changed-markdown-files.outputs.all_changed_files }}
          config: .markdownlint-cli2.jsonc
          separator: ","

      - name: Lint all Markdown files on mainline runs
        if: ${{ github.event_name != 'pull_request' }}
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: |
            README.md
            docs/**/*.md
            .github/**/*.md
            .devcontainer/**/*.md
            src/**/*.md
            tests/**/*.md
            benchmarks/**/*.md
            samples/**/*.md
          config: .markdownlint-cli2.jsonc

      - name: Run repository linters
        run: bash scripts/lint-all.sh --skip-markdown

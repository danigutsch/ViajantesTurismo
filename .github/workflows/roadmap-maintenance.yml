name: Roadmap Maintenance

'on':
  workflow_dispatch:
    inputs:
      apply_changes:
        description: Apply the reviewed plan after protected-environment approval and open a roadmap pull request.
        required: true
        type: boolean
        default: false

concurrency:
  group: roadmap-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan Roadmap Maintenance
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    permissions:
      contents: read
      issues: read
    outputs:
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      artifact_digest: ${{ steps.upload_plan.outputs.artifact-digest }}
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set up repository tool
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          sharedkernel-library-root: ${{ vars.SHAREDKERNEL_LIBRARY_ROOT }}
          sharedkernel-candidate-feed: ${{ vars.SHAREDKERNEL_CANDIDATE_FEED }}
          restore-targets: tools/ViajantesTurismo.RepoConfig.Tool/ViajantesTurismo.RepoConfig.Tool.csproj
          trust-dev-certificate: "false"

      - name: Create integrity-bound plan
        id: plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet tool run sharedkernel-repo -- \
            automation plan-github \
            --root .

      - name: Upload plan
        id: upload_plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roadmap-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/roadmap-maintenance/roadmap-plan.json
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply Roadmap Maintenance
    needs: plan
    if: ${{ inputs.apply_changes && needs.plan.outputs.has_changes == 'true' }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    environment: roadmap-maintenance
    permissions:
      contents: read
      issues: read
    env:
      ROADMAP_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
      ROADMAP_ARTIFACT_DIGEST: ${{ needs.plan.outputs.artifact_digest }}
    steps:
      - name: Checkout planned base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.base_sha }}
          persist-credentials: false

      - name: Set up repository tool
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          sharedkernel-library-root: ${{ vars.SHAREDKERNEL_LIBRARY_ROOT }}
          sharedkernel-candidate-feed: ${{ vars.SHAREDKERNEL_CANDIDATE_FEED }}
          restore-targets: tools/ViajantesTurismo.RepoConfig.Tool/ViajantesTurismo.RepoConfig.Tool.csproj
          trust-dev-certificate: "false"

      - name: Download reviewed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roadmap-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/roadmap-maintenance
          digest-mismatch: error

      - name: Revalidate plan and live inputs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet tool run sharedkernel-repo -- \
            automation validate-plan \
            --root .

      - name: Apply approved closure transitions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet tool run sharedkernel-repo -- \
            automation apply-plan \
            --root .

      - name: Refresh structural reconciliation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet tool run sharedkernel-repo -- \
            reconcile github --apply \
            --root .

      - name: Preview roadmap intake
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet tool run sharedkernel-repo -- \
            intake github --dry-run \
            --root .

      - name: Apply roadmap intake
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet tool run sharedkernel-repo -- \
            intake github --apply \
            --root .

      - name: Validate roadmap output
        shell: bash
        run: |
          dotnet tool run sharedkernel-repo -- verify \
            --root .
          dotnet tool run sharedkernel-repo -- diff \
            --root .
          dotnet run --project tools/ViajantesTurismo.RepoConfig.Tool -c Release -- lint-json
          bash scripts/lint-markdown.sh roadmap/README.md
          bash scripts/lint-links.sh roadmap/README.md

      - name: Seal confined result
        id: seal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet tool run sharedkernel-repo -- \
            automation seal-result \
            --root .

      - name: Create short-lived GitHub App token
        id: app_token
        if: ${{ steps.seal.outputs.has_changes == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ROADMAP_MAINTENANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROADMAP_MAINTENANCE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: read
          permission-pull-requests: write

      - name: Publish create-only roadmap pull request
        id: publish
        if: ${{ steps.seal.outputs.has_changes == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          ROADMAP_RESULT_DIGEST: ${{ steps.seal.outputs.result_digest }}
        run: |
          dotnet tool run sharedkernel-repo -- \
            automation publish-result \
            --root .

      - name: Require published pull request
        if: ${{ steps.seal.outputs.has_changes == 'true' }}
        shell: bash
        env:
          PULL_REQUEST_URL: ${{ steps.publish.outputs.pull_request_url }}
        run: |
          if [[ -z "${PULL_REQUEST_URL}" ]]; then
            echo "Roadmap publication did not return a pull request URL." >&2
            exit 1
          fi
          {
            echo "## Roadmap maintenance pull request"
            echo
            echo "${PULL_REQUEST_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

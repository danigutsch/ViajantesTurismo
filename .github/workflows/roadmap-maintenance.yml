name: Roadmap Maintenance

'on':
  workflow_dispatch:
    inputs:
      apply_changes:
        description: Apply the reviewed plan after protected-environment approval and open a roadmap pull request.
        required: true
        type: boolean
        default: false

concurrency:
  group: roadmap-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan Roadmap Maintenance
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    permissions:
      contents: read
      issues: read
    outputs:
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
      branch_name: ${{ steps.plan.outputs.branch_name }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      artifact_digest: ${{ steps.upload_plan.outputs.artifact-digest }}
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set up repository tool
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          restore-targets: tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj
          trust-dev-certificate: "false"

      - name: Create integrity-bound plan
        id: plan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet run \
            --project tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj \
            --configuration Release \
            --no-restore \
            -- \
            automation plan-github \
            --root .

      - name: Upload plan
        id: upload_plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roadmap-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/roadmap-maintenance/roadmap-plan.json
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply Roadmap Maintenance
    needs: plan
    if: ${{ inputs.apply_changes && needs.plan.outputs.has_changes == 'true' }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    environment: roadmap-maintenance
    permissions:
      contents: read
      issues: read
    env:
      ROADMAP_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
      ROADMAP_ARTIFACT_DIGEST: ${{ needs.plan.outputs.artifact_digest }}
    steps:
      - name: Checkout planned base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.base_sha }}
          persist-credentials: false

      - name: Set up repository tool
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          restore-targets: tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj
          trust-dev-certificate: "false"

      - name: Download reviewed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roadmap-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/roadmap-maintenance
          digest-mismatch: error

      - name: Revalidate plan and live inputs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet run \
            --project tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj \
            --configuration Release \
            --no-restore \
            -- \
            automation validate-plan \
            --root .

      - name: Apply approved closure transitions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet run \
            --project tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            -- \
            automation apply-plan \
            --root .

      - name: Refresh structural reconciliation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet run \
            --project tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            -- \
            reconcile github --apply \
            --root .

      - name: Preview roadmap intake
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet run \
            --project tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            -- \
            intake github --dry-run \
            --root .

      - name: Apply roadmap intake
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet run \
            --project tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            -- \
            intake github --apply \
            --root .

      - name: Validate roadmap output
        shell: bash
        run: |
          dotnet run \
            --project tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            -- verify \
            --root .
          dotnet run \
            --project tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            -- diff \
            --root .
          bash scripts/lint-json.sh roadmap
          bash scripts/lint-markdown.sh roadmap/README.md
          bash scripts/lint-links.sh roadmap/README.md

      - name: Seal confined result
        id: seal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet run \
            --project tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            -- \
            automation seal-result \
            --root .

      - name: Create short-lived GitHub App token
        id: app_token
        if: ${{ steps.seal.outputs.has_changes == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ROADMAP_MAINTENANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROADMAP_MAINTENANCE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: read
          permission-pull-requests: write

      - name: Refuse an existing automation branch
        if: ${{ steps.seal.outputs.has_changes == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          dotnet run \
            --project tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            -- \
            automation ensure-branch-available \
            --root .

      - name: Revalidate immediately before push
        if: ${{ steps.seal.outputs.has_changes == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          ROADMAP_RESULT_DIGEST: ${{ steps.seal.outputs.result_digest }}
        run: |
          dotnet run \
            --project tools/SharedKernel.RepoConfig.Tool/SharedKernel.RepoConfig.Tool.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            -- \
            automation verify-result \
            --root .

      - name: Open roadmap pull request
        id: create_pr
        if: ${{ steps.seal.outputs.has_changes == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app_token.outputs.token }}
          branch: ${{ needs.plan.outputs.branch_name }}
          base: main
          add-paths: roadmap
          commit-message: "chore(roadmap): refresh GitHub reconciliation"
          title: "chore(roadmap): refresh GitHub reconciliation"
          body: |
            Applies the reviewed roadmap maintenance plan from this workflow run.

            Normal pull_request CI is expected to validate the generated branch.
          sign-commits: true
          draft: true

      - name: Summarize pull request
        if: ${{ steps.create_pr.outputs.pull-request-url != '' }}
        shell: bash
        env:
          PULL_REQUEST_URL: ${{ steps.create_pr.outputs.pull-request-url }}
        run: |
          {
            echo "## Roadmap maintenance pull request"
            echo
            echo "${PULL_REQUEST_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

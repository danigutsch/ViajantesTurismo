name: Release Prep

'on':
  pull_request:
    paths:
      - .github/workflows/release-prep.yml
      - src/ViajantesTurismo.AppHost/**
      - docs/architecture/runtime-wiring-and-deployment.md
      - docs/ci/supplemental-workflows.md
      - src/Directory.Build.targets
      - docs/API_COMPATIBILITY.md
      - docs/SHAREDKERNEL_CONSUMPTION.md
      - Directory.Build.props
      - Directory.Packages.props
      - ViajantesTurismo.slnx
      - global.json
      - NuGet.Config
      - .config/**
      - .github/actions/**
  workflow_dispatch:
    inputs:
      prepare_stable:
        description: Validate a stable-version application resource model without tagging or publishing.
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  dry-run:
    name: Resource Model Validation
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    permissions:
      contents: read
    outputs:
      sem_ver: ${{ steps.version.outputs.sem_ver }}
      package_version: ${{ steps.version.outputs.package_version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      file_version: ${{ steps.version.outputs.file_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
      source_tag: ${{ steps.version.outputs.source_tag }}
      release_impact: ${{ steps.version.outputs.release_impact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up CI prerequisites
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          sharedkernel-library-root: ${{ vars.SHAREDKERNEL_LIBRARY_ROOT }}
          sharedkernel-candidate-feed: ${{ vars.SHAREDKERNEL_CANDIDATE_FEED }}
          trust-dev-certificate: "false"

      - name: Restore AppHost dependencies
        run: dotnet restore src/ViajantesTurismo.AppHost/ViajantesTurismo.AppHost.csproj --locked-mode

      - name: Calculate release version
        id: version
        shell: bash
        env:
          RELEASE_VERSION_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_stable && 'stable' || 'prerelease' }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          dotnet tool run sharedkernel-version -- \
            calculate-release \
            --version-kind "${RELEASE_VERSION_KIND}" \
            --run-number "${RUN_NUMBER}" \
            --sha "${SOURCE_SHA}" \
            --github-output "${GITHUB_OUTPUT}" \
            --github-summary "${GITHUB_STEP_SUMMARY}"

      - name: Export Aspire resource model
        shell: bash
        env:
          ComputedSemVer: ${{ steps.version.outputs.sem_ver }}
          ComputedAssemblyVersion: ${{ steps.version.outputs.assembly_version }}
          ComputedFileVersion: ${{ steps.version.outputs.file_version }}
          ComputedInformationalVersion: ${{ steps.version.outputs.informational_version }}
          VT_ASPIRE_CONTAINER_IMAGE_TAG: ${{ steps.version.outputs.package_version }}
          VT_ASPIRE_CONTAINER_REGISTRY: ${{ vars.ASPIRE_CONTAINER_REGISTRY }}
          VT_ASPIRE_DEPLOYMENT_VERSION: ${{ steps.version.outputs.informational_version }}
          VT_ASPIRE_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p artifacts/aspire/release-prep
          dotnet tool run aspire -- 'do' publish-manifest \
            --apphost src/ViajantesTurismo.AppHost/ViajantesTurismo.AppHost.csproj \
            --output-path "${GITHUB_WORKSPACE}/artifacts/aspire/release-prep/aspire-manifest.json" \
            --non-interactive
          test -s artifacts/aspire/release-prep/aspire-manifest.json

      - name: Upload resource model
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-prep-${{ steps.version.outputs.package_version }}
          path: artifacts/aspire/release-prep/aspire-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Summarize release prep
        shell: bash
        run: |
          {
            echo "## Release prep"
            echo
            echo "- Version: \`${{ steps.version.outputs.package_version }}\`"
            echo "- Artifact: Aspire resource model (not deployment-ready output)"
            echo "- Deployment, tagging, and external publishing: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

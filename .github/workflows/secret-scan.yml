name: Secret Scan

'on':
  pull_request:
    types:
      - opened
      - labeled
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  schedule:
    - cron: '53 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && github.run_id || 'validation' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:rerun' }}
    name: ${{ github.event.action == 'labeled' && github.event.label.name != 'ci:rerun' && 'Ignored label event' || 'Secret Scan' }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    permissions:
      contents: read
    outputs:
      sarif_present: ${{ steps.sarif.outputs.present }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up pinned security tooling
        uses: ./.github/actions/setup-ci-prerequisites
        with:
          sharedkernel-library-root: ${{ vars.SHAREDKERNEL_LIBRARY_ROOT }}
          sharedkernel-candidate-feed: ${{ vars.SHAREDKERNEL_CANDIDATE_FEED }}
          restore-targets: tools/ViajantesTurismo.RepoConfig.Tool/ViajantesTurismo.RepoConfig.Tool.csproj
          trust-dev-certificate: "false"

      - name: Install reviewed scanner
        uses: danigutsch/PandaBear.SharedKernel/.github/actions/setup-security-scanner@ee4126348011b2ddf60d3e580428867689c412dd

      - name: Verify baseline and scan current source
        id: gitleaks
        shell: bash
        run: |
          set +e
          dotnet tool run sharedkernel-repo -- security scan --root . --output TestResults/security
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record SARIF availability
        id: sarif
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f TestResults/security/gitleaks.sarif ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF artifact
        if: ${{ always() && steps.sarif.outputs.present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: ignore
          name: gitleaks-sarif
          path: TestResults/security/gitleaks.sarif
          retention-days: 7

      - name: Fail on security violations or scanner errors
        if: ${{ steps.gitleaks.outputs.exit_code != '0' }}
        shell: bash
        run: |
          case "${{ steps.gitleaks.outputs.exit_code }}" in
            1) echo "Security baseline violations or secret findings require review." >&2 ;;
            2) echo "Security baseline configuration or invocation failed." >&2 ;;
            3) echo "Security scanner execution or report validation failed." >&2 ;;
            *) echo "Security scanning did not complete successfully." >&2 ;;
          esac
          exit 1

  upload-secret-scan-sarif:
    name: Publish Secret Scan SARIF
    needs:
      - secret-scan
    # Publish only trusted repository events; forks and merge queues remain read-only.
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:rerun') && always() && needs.secret-scan.outputs.sarif_present == 'true' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ${{ vars.CI_UBUNTU_RUNNER }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gitleaks-sarif
          path: .

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
